<!doctype html>
<!--
  Forgot password — Phase 1. Asks for an email and POSTs it to
  /api/auth/password-reset/request. The answer is the same whether or not
  the email has an account, so this page can't be used to probe accounts.
  Same visual language as login.html.
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reset your password</title>
  <!-- Pinned (see smoke_cdn_pins.py). -->
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <style>
    html { font-size: 19px; }
    body { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  </style>
</head>
<body class="min-h-screen bg-[#fafafa] flex items-center justify-center px-4">
  <div class="w-full max-w-md">
    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-8">
      <h1 class="text-xl font-semibold text-slate-900 mb-1">Reset your password</h1>
      <p class="text-sm text-slate-500 mb-6">Enter the email you sign in with. We'll send you a link to choose a new password.</p>

      <form id="request-form" class="space-y-4">
        <div>
          <label for="email" class="block text-sm font-medium text-slate-700 mb-1">Email</label>
          <input type="email" id="email" required autocomplete="email"
            class="w-full px-3 py-2 border border-slate-300 rounded-lg text-base focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
            placeholder="you@business.com" />
        </div>
        <div id="error-banner" role="alert" class="hidden text-sm text-red-700 bg-red-50 border border-red-200 rounded-lg px-3 py-2"></div>
        <button type="submit" id="submit-btn"
          class="w-full bg-blue-600 hover:bg-blue-700 disabled:bg-blue-300 disabled:cursor-not-allowed text-white font-medium py-2.5 rounded-lg transition-colors">
          Send reset link
        </button>
      </form>

      <div id="sent" role="status" class="hidden text-sm text-emerald-900 bg-emerald-50 border border-emerald-200 rounded-lg px-3 py-3"></div>

      <p class="mt-6 text-sm text-center"><a href="/login" class="text-blue-700 hover:underline">Back to sign in</a></p>
    </div>
  </div>

  <script>
    const form = document.getElementById("request-form");
    const btn = document.getElementById("submit-btn");
    const errorBanner = document.getElementById("error-banner");
    const sent = document.getElementById("sent");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorBanner.classList.add("hidden");
      btn.disabled = true;
      btn.textContent = "Sending…";
      try {
        const resp = await fetch("/api/auth/password-reset/request", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email: document.getElementById("email").value.trim() }),
        });
        const body = await resp.json().catch(() => ({}));
        if (resp.ok) {
          form.classList.add("hidden");
          sent.textContent = body.message || "If that email has an account, a reset link is on its way.";
          sent.classList.remove("hidden");
          return;
        }
        errorBanner.textContent = typeof body.detail === "string"
          ? body.detail
          : (resp.status === 422 ? "That doesn't look like an email address." : `Something went wrong (${resp.status}).`);
        errorBanner.classList.remove("hidden");
      } catch {
        errorBanner.textContent = "Network error. Check your connection and try again.";
        errorBanner.classList.remove("hidden");
      } finally {
        btn.disabled = false;
        btn.textContent = "Send reset link";
      }
    });
  </script>
</body>
</html>
