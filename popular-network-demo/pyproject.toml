[project]
name = "popular-network-demo"
version = "0.1.0"
description = "Popular Network marketing dashboard — FastAPI backend + single-file React/CDN frontend."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.36",
    "pydantic>=2.9.0",
    "httpx>=0.27.0",
    "anthropic>=0.74.1",
    "python-dotenv>=1.0.0",
    "bcrypt>=4.2.0",
    "email-validator>=2.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 110
target-version = "py311"
