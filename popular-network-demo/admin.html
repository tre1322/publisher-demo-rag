<!doctype html>
<!--
  Amplafai admin console — Phase 1.

  For Amplafai operators (superusers) only; /admin redirects everyone else and
  every /api/admin/* call is refused for them. Set up a client in one pass:
  create the business, invite its owner, set its website (chat widget), paste
  its voice brief, then open its dashboard.

  Plain JS like login.html. All user-entered text is rendered with
  textContent / esc() — never as raw HTML.
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin — Amplafai</title>
  <!-- Pinned (see smoke_cdn_pins.py). -->
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <style>
    html { font-size: 17px; }
    body { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    button:disabled { opacity: .5; cursor: not-allowed; }
  </style>
</head>
<body class="min-h-screen bg-[#fafafa] text-slate-900">
  <header class="bg-white border-b border-slate-200">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center gap-4">
      <h1 class="text-lg font-semibold">Amplafai admin</h1>
      <span id="who" class="text-sm text-slate-500">—</span>
      <a href="/" class="ml-auto text-sm text-blue-700 hover:underline">Back to dashboard</a>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-6 space-y-8">
    <div id="page-error" class="hidden text-sm text-red-700 bg-red-50 border border-red-200 rounded-lg px-3 py-2"></div>

    <!-- Create -->
    <section class="bg-white rounded-2xl border border-slate-200 p-6">
      <h2 class="text-base font-semibold mb-1">Set up a new client</h2>
      <p class="text-sm text-slate-500 mb-4">Creates the business with a clean first day (nothing from Quadd, no sample data). If you enter the owner's email, they get an invite to set their password.</p>
      <form id="create-form" class="grid grid-cols-1 md:grid-cols-2 gap-3">
        <label class="text-sm">Business name<input name="name" required class="mt-1 w-full px-3 py-2 border border-slate-300 rounded-lg" placeholder="Smith Hardware" /></label>
        <label class="text-sm">Owner's name<input name="owner" required class="mt-1 w-full px-3 py-2 border border-slate-300 rounded-lg" placeholder="Pat Smith" /></label>
        <label class="text-sm">Owner's email (sends the invite)<input name="owner_email" type="email" class="mt-1 w-full px-3 py-2 border border-slate-300 rounded-lg" placeholder="pat@smithhardware.com" /></label>
        <label class="text-sm">Website<input name="website" class="mt-1 w-full px-3 py-2 border border-slate-300 rounded-lg" placeholder="smithhardware.com" /></label>
        <label class="text-sm">Town<input name="location" class="mt-1 w-full px-3 py-2 border border-slate-300 rounded-lg" placeholder="Windom, MN" /></label>
        <label class="text-sm">Local newspaper partner<input name="publisher" class="mt-1 w-full px-3 py-2 border border-slate-300 rounded-lg" placeholder="Cottonwood County Citizen" /></label>
        <label class="text-sm">Phone<input name="phone" class="mt-1 w-full px-3 py-2 border border-slate-300 rounded-lg" /></label>
        <label class="text-sm">Plan
          <select name="tier" class="mt-1 w-full px-3 py-2 border border-slate-300 rounded-lg bg-white">
            <option value="1">Tier 1 — Self-serve ($30/mo)</option>
            <option value="2" selected>Tier 2 — Surfaced ($75/mo)</option>
            <option value="3">Tier 3 — Concierge ($150/mo)</option>
            <option value="4">Tier 4 — Inventory ($799/mo)</option>
          </select>
        </label>
        <div class="md:col-span-2 flex items-center gap-3">
          <button id="create-btn" type="submit" class="px-4 py-2 rounded-lg bg-slate-900 text-white text-sm font-medium">Create business</button>
          <span id="create-status" class="text-sm text-slate-500" role="status"></span>
        </div>
      </form>
      <div id="create-result" class="hidden mt-4 text-sm bg-emerald-50 border border-emerald-200 rounded-lg p-3"></div>
    </section>

    <!-- List -->
    <section>
      <div class="flex items-center mb-3">
        <h2 class="text-base font-semibold">Businesses</h2>
        <span id="list-status" class="ml-3 text-sm text-slate-500">Loading…</span>
      </div>
      <div id="biz-list" class="space-y-4"></div>
    </section>
  </main>

  <template id="biz-card">
    <article class="bg-white rounded-2xl border border-slate-200 p-5">
      <div class="flex flex-wrap items-start gap-3">
        <div class="min-w-0">
          <h3 class="font-semibold text-lg" data-f="name"></h3>
          <p class="text-sm text-slate-500" data-f="meta"></p>
        </div>
        <span data-f="demo" class="hidden text-xs font-medium px-2 py-0.5 rounded-full bg-amber-100 text-amber-800">Demo account</span>
        <div class="ml-auto flex flex-wrap gap-2">
          <button data-a="open" class="px-3 py-1.5 rounded-lg bg-slate-900 text-white text-sm">Open dashboard</button>
          <button data-a="toggle-edit" class="px-3 py-1.5 rounded-lg border border-slate-300 text-sm">Edit</button>
          <button data-a="toggle-brief" class="px-3 py-1.5 rounded-lg border border-slate-300 text-sm">Voice brief</button>
          <button data-a="toggle-embed" class="px-3 py-1.5 rounded-lg border border-slate-300 text-sm">Chat widget code</button>
        </div>
      </div>
      <div data-f="deletion" class="hidden mt-3 text-sm bg-red-50 border border-red-200 text-red-800 rounded-lg p-3 flex items-center gap-3">
        <span data-f="deletion-text" class="flex-1"></span>
        <button type="button" data-a="cancel-deletion" class="px-3 py-1.5 rounded-lg border border-red-300 bg-white">Cancel deletion</button>
      </div>
      <div data-f="requests" class="hidden mt-3 text-sm bg-amber-50 border border-amber-200 rounded-lg p-3">
        <div class="font-medium text-amber-900 mb-1">Waiting for a reply</div>
        <ul data-f="request-list" class="space-y-2"></ul>
      </div>
      <dl class="mt-3 grid grid-cols-1 md:grid-cols-3 gap-3 text-sm">
        <div><dt class="text-slate-500">People</dt><dd data-f="members"></dd></div>
        <div><dt class="text-slate-500">Pending invites</dt><dd data-f="invites"></dd></div>
        <div><dt class="text-slate-500">Voice brief</dt><dd data-f="brief"></dd></div>
        <div><dt class="text-slate-500">Owner setup</dt><dd data-f="setup"></dd></div>
      </dl>
      <form data-p="invite" class="mt-3 flex flex-wrap items-end gap-2 text-sm">
        <label>Invite someone<input name="email" type="email" required placeholder="name@business.com" class="mt-1 block px-3 py-1.5 border border-slate-300 rounded-lg" /></label>
        <label>Role
          <select name="role" class="mt-1 block px-3 py-1.5 border border-slate-300 rounded-lg bg-white">
            <option value="owner">Owner</option><option value="editor">Editor</option><option value="viewer">Viewer (read-only)</option>
          </select>
        </label>
        <button class="px-3 py-1.5 rounded-lg border border-slate-300">Send invite</button>
      </form>

      <form data-p="edit" class="hidden mt-4 grid grid-cols-1 md:grid-cols-2 gap-3 text-sm border-t border-slate-100 pt-4">
        <label>Business name<input name="name" class="mt-1 w-full px-3 py-2 border border-slate-300 rounded-lg" /></label>
        <label>Owner's name<input name="owner" class="mt-1 w-full px-3 py-2 border border-slate-300 rounded-lg" /></label>
        <label>Website (also unlocks the chat widget there)<input name="website" class="mt-1 w-full px-3 py-2 border border-slate-300 rounded-lg" /></label>
        <label>Town<input name="location" class="mt-1 w-full px-3 py-2 border border-slate-300 rounded-lg" /></label>
        <label>Local newspaper partner<input name="publisher" class="mt-1 w-full px-3 py-2 border border-slate-300 rounded-lg" /></label>
        <label>Phone<input name="phone" class="mt-1 w-full px-3 py-2 border border-slate-300 rounded-lg" /></label>
        <label>Plan
          <select name="tier" class="mt-1 w-full px-3 py-2 border border-slate-300 rounded-lg bg-white">
            <option value="1">Tier 1 — Self-serve</option><option value="2">Tier 2 — Surfaced</option>
            <option value="3">Tier 3 — Concierge</option><option value="4">Tier 4 — Inventory</option>
          </select>
        </label>
        <label class="flex items-center gap-2 mt-6"><input type="checkbox" name="demo" /> Demo account (allows the simulator and sample data)</label>
        <div class="md:col-span-2"><button class="px-4 py-2 rounded-lg bg-slate-900 text-white">Save changes</button></div>
      </form>

      <form data-p="brief" class="hidden mt-4 text-sm border-t border-slate-100 pt-4">
        <p class="text-slate-500 mb-2">Paste the synthesized voice brief (JSON from the interview pipeline). The AI agent reads it on its next message.</p>
        <textarea name="brief" rows="10" class="w-full font-mono text-xs px-3 py-2 border border-slate-300 rounded-lg" placeholder='{"voice": "...", "amplify": [...], "audience": "..."}'></textarea>
        <div class="mt-2 flex gap-2">
          <button class="px-4 py-2 rounded-lg bg-slate-900 text-white">Save brief</button>
          <button type="button" data-a="clear-brief" class="px-4 py-2 rounded-lg border border-slate-300">Remove brief</button>
        </div>
      </form>

      <div data-p="embed" class="hidden mt-4 text-sm border-t border-slate-100 pt-4">
        <p class="text-slate-500 mb-2" data-f="embed-note"></p>
        <pre data-f="snippet" class="bg-slate-900 text-slate-100 rounded-lg p-3 text-xs overflow-x-auto">Loading…</pre>
        <button type="button" data-a="copy-embed" class="mt-2 px-3 py-1.5 rounded-lg border border-slate-300">Copy code</button>
      </div>

      <div class="mt-4 pt-3 border-t border-slate-100 flex flex-wrap items-center gap-2 text-sm">
        <span class="text-slate-500 mr-1">Emails</span>
        <button type="button" data-a="preview-approvals" class="px-3 py-1.5 rounded-lg border border-slate-300">Email me the approvals reminder</button>
        <button type="button" data-a="preview-weekly" class="px-3 py-1.5 rounded-lg border border-slate-300">Email me the weekly summary</button>
      </div>

      <div class="mt-3 pt-3 border-t border-slate-100 flex flex-wrap items-center gap-2 text-sm">
        <span class="text-slate-500 mr-1">Data</span>
        <a data-a="export" class="px-3 py-1.5 rounded-lg border border-slate-300" download>Export (JSON)</a>
        <button type="button" data-a="schedule-deletion" class="px-3 py-1.5 rounded-lg border border-red-200 text-red-700">Schedule deletion (30 days)</button>
        <button type="button" data-a="delete-now" class="px-3 py-1.5 rounded-lg border border-red-300 text-red-700">Delete now…</button>
      </div>

      <div data-f="msg" class="hidden mt-3 text-sm rounded-lg px-3 py-2" role="status"></div>
    </article>
  </template>

<script>
const SETUP_LABELS = {
  not_started: 'Not started', answering: 'Answering questions', drafting: 'Drafting brief…',
  review: 'Reviewing draft brief', planning: 'Planning first week…', plan_failed: 'First-week plan failed (owner can retry)',
  skipped: 'Skipped for now', done: 'Done',
};
const TIER_NAMES = {1: 'Tier 1 — Self-serve', 2: 'Tier 2 — Surfaced', 3: 'Tier 3 — Concierge', 4: 'Tier 4 — Inventory'};

function detailOf(body, status) {
  if (!body) return `HTTP ${status}`;
  if (typeof body.detail === 'string') return body.detail;
  if (Array.isArray(body.detail)) return body.detail.map(d => `${(d.loc || []).slice(-1)[0]}: ${d.msg}`).join('; ');
  return `HTTP ${status}`;
}

async function api(method, path, body) {
  const r = await fetch(path, {
    method, headers: body ? {'Content-Type': 'application/json'} : {},
    body: body ? JSON.stringify(body) : undefined,
  });
  const json = await r.json().catch(() => null);
  if (r.status === 401) { window.location = '/login'; throw new Error('Signed out'); }
  if (!r.ok) throw new Error(detailOf(json, r.status));
  return json;
}

function showPageError(msg) {
  const el = document.getElementById('page-error');
  el.textContent = msg; el.classList.toggle('hidden', !msg);
}

function inviteLink(inv) {
  return inv ? `${location.origin}${inv.claimUrl}` : '';
}

function inviteSummary(inv) {
  const sent = inv.emailDelivery && inv.emailDelivery.sent;
  return sent
    ? `Invite emailed to ${inv.email}. Backup link (valid 14 days, shown once): `
    : `Email not sent (${(inv.emailDelivery && inv.emailDelivery.reason) || 'unknown'}). Send ${inv.email} this link yourself (valid 14 days, shown once): `;
}

function setMsg(card, text, ok) {
  const el = card.querySelector('[data-f="msg"]');
  el.textContent = text;
  el.className = `mt-3 text-sm rounded-lg px-3 py-2 ${ok ? 'bg-emerald-50 border border-emerald-200 text-emerald-900' : 'bg-red-50 border border-red-200 text-red-700'}`;
  el.classList.toggle('hidden', !text);
}

function appendLink(el, url) {
  const code = document.createElement('code');
  code.className = 'break-all select-all bg-white px-1 rounded';
  code.textContent = url;
  el.appendChild(code);
}

async function withBusy(btn, fn) {
  btn.disabled = true;
  try { await fn(); } finally { btn.disabled = false; }
}

function renderCard(b) {
  const card = document.getElementById('biz-card').content.firstElementChild.cloneNode(true);
  card.dataset.id = b.id;
  const f = (k) => card.querySelector(`[data-f="${k}"]`);
  f('name').textContent = b.name;
  f('meta').textContent = [b.owner, b.location, TIER_NAMES[b.tier] || b.tierLabel, b.website || 'no website yet']
    .filter(Boolean).join(' · ');
  f('demo').classList.toggle('hidden', !b.isDemo);
  f('members').textContent = b.members.length
    ? b.members.map(m => `${m.email} (${m.role})`).join(', ') : 'Nobody has signed in yet';
  f('invites').textContent = b.pendingInvites.length
    ? b.pendingInvites.map(i => `${i.email} (${i.role})`).join(', ') : 'None';
  f('brief').textContent = b.hasVoiceBrief ? 'Loaded' : 'Not yet — the agent writes from the marketing plan only';
  f('setup').textContent = SETUP_LABELS[b.onboardingStatus] || b.onboardingStatus || '—';
  f('deletion').classList.toggle('hidden', !b.deletionDueAt);
  if (b.deletionDueAt) {
    f('deletion-text').textContent = `Scheduled for deletion on ${new Date(b.deletionDueAt + 'Z').toLocaleDateString()}. The owner sees a warning in their dashboard.`;
  }
  card.querySelector('[data-a="schedule-deletion"]').disabled = !!b.deletionDueAt;
  card.querySelector('[data-a="export"]').href = `/api/admin/businesses/${b.id}/export`;
  for (const kind of ['approvals', 'weekly']) {
    card.querySelector(`[data-a="preview-${kind}"]`).onclick = (ev) => withBusy(ev.currentTarget, async () => {
      try {
        const res = await api('POST', `/api/admin/businesses/${b.id}/notifications/preview`, {kind});
        setMsg(card, res.ok ? `Sent to ${res.to}. This is exactly what ${b.name}'s owners get.`
                            : `Not sent (${res.reason || 'unknown'}). Check POSTMARK_API_KEY on the server.`, res.ok);
      } catch (e) { setMsg(card, e.message, false); }
    });
  }
  const confirmName = (verb) => {
    const typed = prompt(`${verb} ${b.name}? Type the business name to confirm:`);
    return typed === null ? null : typed;
  };
  card.querySelector('[data-a="schedule-deletion"]').onclick = (ev) => withBusy(ev.currentTarget, async () => {
    const typed = confirmName('Schedule deletion of');
    if (typed === null) return;
    try {
      const res = await api('POST', `/api/admin/businesses/${b.id}/schedule-deletion`, {confirm_name: typed});
      replaceCard(card, res.business, 'Deletion scheduled. Cancel any time in the next 30 days.');
    } catch (err) { setMsg(card, `Not scheduled: ${err.message}`, false); }
  });
  card.querySelector('[data-a="cancel-deletion"]').onclick = (ev) => withBusy(ev.currentTarget, async () => {
    try {
      const res = await api('POST', `/api/admin/businesses/${b.id}/cancel-deletion`);
      replaceCard(card, res.business, 'Deletion cancelled. Nothing will be removed.');
    } catch (err) { setMsg(card, `Not cancelled: ${err.message}`, false); }
  });
  card.querySelector('[data-a="delete-now"]').onclick = (ev) => withBusy(ev.currentTarget, async () => {
    const typed = confirmName('PERMANENTLY delete all data for');
    if (typed === null) return;
    try {
      const res = await api('POST', `/api/admin/businesses/${b.id}/delete-now`, {confirm_name: typed});
      const n = Object.values(res.deleted).reduce((a, x) => a + x, 0);
      card.remove();
      showPageError('');
      document.getElementById('list-status').textContent = `${b.name} deleted (${n} rows). Copies in older backups age out on the backup schedule.`;
    } catch (err) { setMsg(card, `Not deleted: ${err.message}`, false); }
  });
  f('requests').classList.toggle('hidden', !(b.openRequests || []).length);
  for (const req of (b.openRequests || [])) {
    const li = document.createElement('li');
    li.className = 'flex items-start gap-2';
    const text = document.createElement('span');
    text.className = 'flex-1';
    text.textContent = `${new Date(req.createdAt + 'Z').toLocaleString()} — ${req.message}`;
    const done = document.createElement('button');
    done.className = 'shrink-0 px-2 py-0.5 rounded border border-amber-300 text-xs';
    done.textContent = 'Mark handled';
    done.onclick = () => withBusy(done, async () => {
      try {
        const res = await api('POST', `/api/admin/escalations/${req.id}/handled`);
        replaceCard(card, res.business, 'Marked handled.');
      } catch (err) { setMsg(card, `Not updated: ${err.message}`, false); }
    });
    li.append(text, done);
    f('request-list').appendChild(li);
  }

  const edit = card.querySelector('[data-p="edit"]');
  for (const k of ['name', 'owner', 'website', 'location', 'publisher', 'phone']) edit.elements[k].value = b[k] || '';
  edit.elements.tier.value = String(b.tier);
  edit.elements.demo.checked = !!b.isDemo;

  const toggle = (panel) => card.querySelector(`[data-p="${panel}"]`).classList.toggle('hidden');
  card.querySelector('[data-a="toggle-edit"]').onclick = () => toggle('edit');
  card.querySelector('[data-a="toggle-brief"]').onclick = () => toggle('brief');
  card.querySelector('[data-a="toggle-embed"]').onclick = async () => {
    toggle('embed');
    try {
      const e = await api('GET', `/api/admin/businesses/${b.id}/embed`);
      f('snippet').textContent = e.snippet;
      f('embed-note').textContent = e.allowedOrigins.length
        ? `Paste this before </body> on ${e.allowedOrigins.join(' or ')}. The widget only answers on those sites.`
        : 'Set the website first (Edit) — until then the widget answers on any site that pastes this code.';
    } catch (err) { f('snippet').textContent = `Couldn't load: ${err.message}`; }
  };
  card.querySelector('[data-a="copy-embed"]').onclick = async () => {
    try { await navigator.clipboard.writeText(f('snippet').textContent); setMsg(card, 'Widget code copied.', true); }
    catch { setMsg(card, 'Copy failed — select the code and copy it by hand.', false); }
  };
  card.querySelector('[data-a="open"]').onclick = (ev) => withBusy(ev.currentTarget, async () => {
    try { await api('POST', `/api/admin/businesses/${b.id}/open`); window.location = '/'; }
    catch (err) { setMsg(card, `Couldn't open: ${err.message}`, false); }
  });

  edit.onsubmit = (ev) => {
    ev.preventDefault();
    withBusy(edit.querySelector('button'), async () => {
      const el = edit.elements;
      try {
        const res = await api('PUT', `/api/admin/businesses/${b.id}`, {
          name: el.name.value, owner: el.owner.value, website: el.website.value,
          location: el.location.value, publisher: el.publisher.value, phone: el.phone.value,
          tier: Number(el.tier.value), demo: el.demo.checked,
        });
        replaceCard(card, res.business, 'Saved.');
      } catch (err) { setMsg(card, `Not saved: ${err.message}`, false); }
    });
  };

  const brief = card.querySelector('[data-p="brief"]');
  brief.onsubmit = (ev) => {
    ev.preventDefault();
    withBusy(brief.querySelector('button'), async () => {
      let parsed;
      try { parsed = JSON.parse(brief.elements.brief.value); }
      catch (err) { setMsg(card, `That isn't valid JSON: ${err.message}`, false); return; }
      try {
        const res = await api('PUT', `/api/admin/businesses/${b.id}/voice-brief`, {brief: parsed});
        replaceCard(card, res.business, 'Voice brief saved. The agent uses it from the next message on.');
      } catch (err) { setMsg(card, `Not saved: ${err.message}`, false); }
    });
  };
  card.querySelector('[data-a="clear-brief"]').onclick = (ev) => withBusy(ev.currentTarget, async () => {
    if (!confirm(`Remove ${b.name}'s voice brief?`)) return;
    try {
      const res = await api('PUT', `/api/admin/businesses/${b.id}/voice-brief`, {brief: null});
      replaceCard(card, res.business, 'Voice brief removed.');
    } catch (err) { setMsg(card, `Not removed: ${err.message}`, false); }
  });

  const inv = card.querySelector('[data-p="invite"]');
  inv.onsubmit = (ev) => {
    ev.preventDefault();
    withBusy(inv.querySelector('button'), async () => {
      try {
        const res = await api('POST', `/api/admin/businesses/${b.id}/invites`,
          {email: inv.elements.email.value, role: inv.elements.role.value});
        const fresh = await api('GET', '/api/admin/businesses');
        const updated = fresh.businesses.find(x => x.id === b.id);
        const newCard = replaceCard(card, updated, inviteSummary(res));
        appendLink(newCard.querySelector('[data-f="msg"]'), inviteLink(res));
      } catch (err) { setMsg(card, `Invite not sent: ${err.message}`, false); }
    });
  };
  return card;
}

function replaceCard(oldCard, business, msg) {
  const card = renderCard(business);
  oldCard.replaceWith(card);
  if (msg) setMsg(card, msg, true);
  return card;
}

async function loadList() {
  const status = document.getElementById('list-status');
  const list = document.getElementById('biz-list');
  try {
    const data = await api('GET', '/api/admin/businesses');
    list.replaceChildren(...data.businesses.map(renderCard));
    status.textContent = `${data.businesses.length} total`;
  } catch (err) {
    status.textContent = '';
    showPageError(`Couldn't load businesses: ${err.message}`);
  }
}

document.getElementById('create-form').onsubmit = (ev) => {
  ev.preventDefault();
  const form = ev.currentTarget;
  const status = document.getElementById('create-status');
  const result = document.getElementById('create-result');
  withBusy(document.getElementById('create-btn'), async () => {
    status.textContent = 'Creating…';
    result.classList.add('hidden');
    const el = form.elements;
    const body = {
      name: el.name.value, owner: el.owner.value, website: el.website.value || null,
      location: el.location.value, publisher: el.publisher.value, phone: el.phone.value,
      tier: Number(el.tier.value), owner_email: el.owner_email.value || null,
    };
    try {
      const res = await api('POST', '/api/admin/businesses', body);
      status.textContent = '';
      result.replaceChildren();
      const line = document.createElement('p');
      line.textContent = `${res.business.name} is set up.` + (res.invite ? ' ' + inviteSummary(res.invite) : ' No owner invite yet — use "Invite someone" on its card.');
      result.appendChild(line);
      if (res.invite) appendLink(line, inviteLink(res.invite));
      result.className = 'mt-4 text-sm bg-emerald-50 border border-emerald-200 rounded-lg p-3';
      form.reset();
      await loadList();
    } catch (err) {
      status.textContent = '';
      result.replaceChildren(document.createTextNode(`Not created: ${err.message}`));
      result.className = 'mt-4 text-sm bg-red-50 border border-red-200 text-red-700 rounded-lg p-3';
    }
  });
};

(async () => {
  try {
    const me = await api('GET', '/api/auth/me');
    document.getElementById('who').textContent = me.email;
    if (!me.is_superuser) { window.location = '/'; return; }
  } catch (err) { showPageError(`Couldn't check your sign-in: ${err.message}`); }
  loadList();
})();
</script>
</body>
</html>
