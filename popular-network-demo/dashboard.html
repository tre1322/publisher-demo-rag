<!doctype html>
<!--
  Popular Network — Marketing Agent dashboard demo
  ================================================
  WHAT THIS IS
    A static, self-contained sample of what a Tier 2 / Tier 3 small business
    owner sees when they log into the Popular Network Marketing Agent. Built
    as a partner demo to communicate product vision. No backend, no APIs —
    every value on screen is mock data hardcoded below.

  HOW TO OPEN
    Double-click this file. It opens in any modern browser. No build, no
    install. React 18, Tailwind, and Lucide are loaded via CDN.

  THE DEMO BUSINESS
    Quadd.ai — New Ulm, Minnesota
    Owner: Trevor Slette, Tier 3 Concierge, Day 1 with Popular Network.
    Voice brief synthesized from a real 23-minute interview
    (see data/voice-brief/quadd_ai.json).

  EIGHT VIEWS
    1. Home / Overview
    2. Content Calendar
    3. Approvals Queue
    4. Performance
    5. Reviews
    6. Marketing Plan
    7. AI Agent Chat
    8. Settings
-->

  const LineChart = ({ current, prev, width = 640, height = 200, padding = 28 }) => {
    // || 1 guards the Day-1 all-zero series: max=0 made stepY divide by zero
    // and emit NaN path coordinates (4 console errors per render, blank paths).
    const max = (Math.max(...current, ...prev) || 1) * 1.10;
    const w = width - padding * 2, h = height - padding * 2;
    const stepX = (i, n) => padding + (i / (n - 1)) * w;
    const stepY = (v) => padding + h - (v / max) * h;
    const path = (arr) => arr.map((v, i) => `${i === 0 ? 'M' : 'L'} ${stepX(i, arr.length).toFixed(1)} ${stepY(v).toFixed(1)}`).join(' ');
    const fill = (arr) => path(arr) + ` L ${stepX(arr.length - 1, arr.length).toFixed(1)} ${padding + h} L ${stepX(0, arr.length).toFixed(1)} ${padding + h} Z`;

    const arc = (start, end, rOuter, rInner) => {
      const x1 = cx + rOuter * Math.cos(start), y1 = cy + rOuter * Math.sin(start);
      const x2 = cx + rOuter * Math.cos(end),   y2 = cy + rOuter * Math.sin(end);
      const x3 = cx + rInner * Math.cos(end),   y3 = cy + rInner * Math.sin(end);
      const x4 = cx + rInner * Math.cos(start), y4 = cy + rInner * Math.sin(start);
      const large = end - start > Math.PI ? 1 : 0;
      return `M ${x1} ${y1} A ${rOuter} ${rOuter} 0 ${large} 1 ${x2} ${y2} L ${x3} ${y3} A ${rInner} ${rInner} 0 ${large} 0 ${x4} ${y4} Z`;
    };
    return (
      <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
        {slices.map((s, i) => {
          const sweep = (s.pct / total) * Math.PI * 2;
          const start = angle, end = angle + sweep;
          angle = end;
          return <path key={i} d={arc(start, end, r, rInner)} fill={s.color} />;
        })}
      </svg>
    );
  };

  const Sparkline = ({ values, width = 100, height = 28, color = '#0E5E6F' }) => {
    const min = Math.min(...values) - 0.05;
    const max = Math.max(...values) + 0.05;
    const stepX = (i) => (i / (values.length - 1)) * (width - 4) + 2;
    const stepY = (v) => height - 2 - ((v - min) / (max - min)) * (height - 4);
    const d = values.map((v, i) => `${i === 0 ? 'M' : 'L'} ${stepX(i).toFixed(1)} ${stepY(v).toFixed(1)}`).join(' ');
    return (
      <svg width={width} height={height} viewBox={`0 0 ${width} ${height}`}>
        <path d={d} fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" />
        <circle cx={stepX(values.length - 1)} cy={stepY(values[values.length - 1])} r="2.5" fill={color} />
      </svg>
    );
  };

  /* ============================================================

  // Polish item: "Train the bot on this" pulls the consumer's opening intent
  // out of a chatbot transcript and queues it as a phrase to add to the
  // Marketing Plan's customer-language list. Decision: first consumer turn
  // only (cleanest signal of intent), case-insensitive exact dedupe against
  // the existing list (predictable; same phrase doesn't pile up).
  const extractTrainingPhrases = (transcript) => {
    const opener = (transcript?.transcript || []).find(t => t.who === 'consumer');
    const text = (opener?.text || '').trim();
    return text ? [text] : [];
  };
  const mergeCustomerLanguage = (existing, incoming) => {
    const have = new Set((existing || []).map(p => p.trim().toLowerCase()));
    const out = [...(existing || [])];
    for (const p of incoming) {
      const key = p.trim().toLowerCase();
      if (key && !have.has(key)) { have.add(key); out.push(p.trim()); }
    }
    return out;
  };

  /* ============================================================
     VIEW: COMPOSE — brief + per-platform editor + live preview
     ============================================================ */
  const ComposeView = ({ onNavigate }) => {
    const { business, stats, attention, weekRecap, posts, approvals, performance, reviews, marketingPlan, chat, settings, reach } = useDashboard();
    const mutate = useDashboardMutate();
    const [topic, setTopic] = useState('Why publishers love the universal document extractor');
    const [notes, setNotes] = useState('Lead with the Citizen Publishing time-savings testimonial — 2–3 hours/week. Founder credibility (28 years as a publisher) is the wedge. End with the 7-day free trial.');
    const [chosen, setChosen] = useState(['fb', 'ig', 'gbp', 'web']);
    const [imageMode, setImageMode] = useState('owner');

    const [activeTab, setActiveTab] = useState('fb');
    const [saving, setSaving] = useState(null);   // 'draft' | 'pending' | null
    const [saveError, setSaveError] = useState(null);
    const [saveToast, setSaveToast] = useState(null);
    const [confirmSend, setConfirmSend] = useState(false);

    // Phase D.2 — Reach Configurator state. Card surfaces only when FB is in

    const [reachTier, setReachTier]       = useState('local');
    const [reachBaseRate, setReachBaseRate] = useState(200);   // dollars

    const reachVisible = chosen.includes('fb');

    // Phase E.3 — Boost-on-launch state. Distinct from Phase D's Reach

    // accents (violet vs amber) + Phase 1.5 vs Phase 2 framing.
    const [boostEnabled, setBoostEnabled]   = useState(false);
    const [boostPlatform, setBoostPlatform] = useState('fb_ig');
    const [boostDaily, setBoostDaily]       = useState('20');
    const [boostDays, setBoostDays]         = useState('7');
    const boostVisible = chosen.length > 0;  // any paid surface counts

    // Re-draft from brief — single LLM call that fills setDrafts() with fresh

    const [reDrafting, setReDrafting] = useState(false);
    const [reDraftError, setReDraftError] = useState(null);

    useEffect(() => {
      if (!reachVisible) { setReachEstimate(null); return; }
      // Light debounce so rapid-fire typing in the base-rate input doesn't
      // hammer the endpoint. 200ms feels live without spamming.
      const ctrl = new AbortController();
      const t = setTimeout(() => {
        setReachEstimating(true);
        setReachEstimateError(null);
        fetch('/api/reach/estimate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            tier_key: reachTier,
            base_rate_cents: Math.max(0, Math.round(reachBaseRate * 100)),
            days: Math.max(1, Math.min(90, reachDays | 0)),
            platforms: chosen,
          }),
          signal: ctrl.signal,
        })
          .then(r => r.ok ? r.json() : r.text().then(txt => Promise.reject(`HTTP ${r.status}: ${txt}`)))
          .then(data => setReachEstimate(data))
          .catch(e => {
            if (e.name !== 'AbortError') {
              setReachEstimateError(String(e.message || e));
              setReachEstimate(null);
            }
          })
          .finally(() => setReachEstimating(false));
      }, 200);
      return () => { clearTimeout(t); ctrl.abort(); };
    }, [reachVisible, reachTier, reachBaseRate, reachDays, chosen.join(',')]);

    useEffect(() => {
      if (!saveToast) return;

    }, [saveToast]);
    const [drafts, setDrafts] = useState({
      fb: {
        text: 'A writer at Citizen Publishing is saving 2-3 hours every week with Quadd.ai. No question.\n\nThat\'s back-to-back interviews she\'s not re-typing. Council meetings she\'s not slogging through before she writes the first word. Actual journalism time, returned.\n\n7-day free trial. See what your newsroom gets back: quadd.ai',
        cta: 'Learn more'
      },
      ig: {
        caption: 'Re-typing court documents? Slogging through transcripts before you can write a single word? Built by a publisher with 28 years in. Quadd.ai gives your staff back 2-3 hours every week. 🗞️\n\nLink in bio.',
        hashtags: '#NewsroomTools #JournalismLife #LocalNews #PublishingTech #SmallTownNews'
      },
      gbp: {
        headline: 'Quadd.ai · 7-day free trial',
        text: 'AI tools built for newspaper publishers, by a publisher. Document extraction, AP-style checking, interview transcription.',
        cta: 'Learn more'
      },
      web: {
        title: 'Why publishers love the Universal Document Extractor',
        subtitle: 'Built by a 28-year publisher who got tired of re-typing court documents by hand.',
        body: 'Most newsroom staff are spending hours every week on work that has nothing to do with journalism. Re-typing court filings. Reformatting press releases. Slogging through interview audio before they write a single word.\n\nA writer at Citizen Publishing was doing all of that. Then they put Quadd.ai\'s Universal Document Extractor to work. The result: 2-3 hours saved every week. No question. They\'re now rolling it to the rest of the newsroom.\n\nThe tool learns your publication\'s own template and returns formatted, ready-to-use content in minutes. The court document problem — that 38-page filing you used to dread — becomes a non-event.\n\nQuadd.ai includes three tools in one bundle: Universal Document Extractor, AP-Style Checker, and Interview Transcription. The 7-day free trial is exactly that. Free. No card required. Load in your actual documents and see what happens.\n\nIf your staff is still grinding through documents and transcripts before they can write the first word, there\'s a better way.',
        slug: '/blog/universal-document-extractor-publishers',
        readTime: '3 min'
      }
    });

    const updateDraft = (platform, field, value) =>
      setDrafts(d => ({ ...d, [platform]: { ...d[platform], [field]: value } }));

    const togglePlatform = (p) => {
      setChosen(prev => {
        if (prev.includes(p)) {
          const next = prev.filter(x => x !== p);
          if (activeTab === p && next.length) setActiveTab(next[0]);
          return next;
        }
        const next = [...prev, p];
        return next;
      });
    };

    // limits: FB optimal ~280 (max much higher), IG caption optimal ~150 / max 2200, GBP max ~1500
    const fbLen  = drafts.fb.text.length;
    const igLen  = drafts.ig.caption.length;
    const gbpLen = drafts.gbp.text.length;
    const webWords = drafts.web.body.trim().split(/\s+/).length;

    const tones = [
      { id: 'friendly',  label: 'Friendly' },
      { id: 'direct',    label: 'Direct' },
      { id: 'promo',     label: 'Promotional' },
      { id: 'urgent',    label: 'Urgent' }
    ];

    // Re-draft from brief — fires one /api/compose/redraft call, replaces the
    // per-platform draft fields in setDrafts. Honors topic/notes/tone/imageMode/
    // chosen + the voice brief loaded server-side via build_system_prompt.
    const handleReDraft = async () => {
      if (reDrafting || chosen.length === 0) return;
      if (!topic.trim()) {
        setReDraftError('Add a brief topic first.');
        return;
      }
      setReDrafting(true);
      setReDraftError(null);
      try {
        const resp = await fetch('/api/compose/redraft', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            topic: topic.trim(),
            notes: notes.trim(),
            tone,
            image_mode: imageMode,
            platforms: chosen,
          }),
        });
        if (!resp.ok) {
          const txt = await resp.text();
          throw new Error(`HTTP ${resp.status}: ${txt.slice(0, 200)}`);
        }
        const data = await resp.json();
        // Spread per-platform drafts into existing state — keep platforms that
        // weren't re-drafted untouched (defensive; the server already filters).
        setDrafts(prev => ({ ...prev, ...(data.drafts || {}) }));
        const n = Object.keys(data.drafts || {}).length;
        setSaveToast(`Re-drafted ${n} platform${n === 1 ? '' : 's'} from your brief.`);
      } catch (e) {
        console.error('[compose.redraft] failed', e);
        setReDraftError(String(e.message || e));
      } finally {
        setReDrafting(false);
      }
    };

    // Each platform packs its own per-channel fields into the (title, draft)
    // pair the Post model exposes. The Brief Topic is the canonical Post.title
    // for ALL four platforms so the Approvals queue / Calendar / Drafts label
    // posts uniformly. Per-platform headline/title inputs (GBP, Web) become
    // body content embedded into the draft text — they're auxiliary, not the
    // unified row label.
    const platformPayload = (p) => {
      const d = drafts[p];
      const title = topic.trim() || `Untitled ${PLATFORMS[p].label.split(' ')[0]} post`;
      switch (p) {
        case 'fb':
          return { title, draft: d.text + (d.cta ? `\n\nCTA: ${d.cta}` : '') };
        case 'ig':
          return { title, draft: d.caption + (d.hashtags ? `\n\n${d.hashtags}` : '') };
        case 'gbp':
          return {
            title,
            // Embed the GBP-specific headline as the lead line of the draft
            // body so it doesn't disappear from the post when we use Topic
            // as the unified title.
            draft: (d.headline ? `${d.headline}\n\n` : '') + d.text + (d.cta ? `\n\nCTA: ${d.cta}` : ''),
          };
        case 'web':
          return {
            title,
            // Same idea for Web: the blog title and subtitle become body lead.
            draft: (d.title ? `${d.title}\n\n` : '') + (d.subtitle ? `${d.subtitle}\n\n` : '') + d.body,
          };
        default:
          return { title, draft: '' };
      }
    };

    // Sequential POST per chosen platform. status='draft' or 'pending'.
    // On 'pending', the backend also creates an Approval row pointing at the
    // new Post, which we slot into the queue optimistically. Stops on the
    // first failure so partial errors are recoverable from the toast.
    const submit = async (status) => {
      if (saving || chosen.length === 0) return;
      setSaving(status);
      setSaveError(null);
      setSaveToast(null);
      const failed = [];
      const succeeded = [];

      for (const platform of chosen) {
        const payload = platformPayload(platform);
        if (!payload.draft || !payload.draft.trim()) {
          failed.push({ platform, error: 'empty draft' });
          continue;
        }
        try {
          const resp = await fetch('/api/posts', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              platform,
              status,
              title: payload.title,
              draft: payload.draft,
              reasoning: notes.trim() || null,
            }),
          });
          if (!resp.ok) {
            const detail = await resp.json().catch(() => ({ detail: `HTTP ${resp.status}` }));
            throw new Error(detail.detail || `HTTP ${resp.status}`);
          }
          const json = await resp.json();
          succeeded.push({ platform, post: json.post, approval: json.approval });
          // Slot into context so Calendar/Approvals reflect immediately
          mutate(prev => {
            if (!prev) return prev;
            const next = { ...prev, posts: [...(prev.posts || []), json.post] };
            if (json.approval) {
              next.approvals = [...(prev.approvals || []), {
                id: json.approval.id,
                internalId: json.approval.internalId,
                platform: json.approval.platform,
                title: json.approval.title,
                draft: json.approval.draft,
                note: json.approval.note,
                kind: 'post',
              }];
            }
            return next;
          });
        } catch (e) {
          console.error(`[compose] POST ${platform} failed`, e);
          failed.push({ platform, error: e.message || String(e) });
          break;   // halt the chain on error; remaining platforms are recoverable
        }
      }

      // Phase E.3 — if Boost on launch is enabled AND status='pending'
      // (send-for-review), also create an agent_proposed AdCampaign so the
      // boost approval lands in the queue next to the post approvals.
      // Skip on 'draft' (no point booking spend on a stash-only post) and
      // on failure (don't create a boost for a post that didn't ship).
      let boostSucceeded = false;
      if (status === 'pending' && boostEnabled && succeeded.length > 0 && failed.length === 0) {
        const dailyCents = Math.max(100, Math.round(parseFloat(boostDaily || '0') * 100));
        const days = Math.max(1, Math.min(90, parseInt(boostDays || '0', 10) || 0));
        try {
          const resp = await fetch('/api/ads/campaigns', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              platform: boostPlatform,
              name: `Boost: ${topic.trim() || 'untitled post'}`,
              daily_budget_cents: dailyCents,
              duration_days: days,
              post_id: succeeded[0]?.post?.internalId || null,
              target_audience: notes.trim() || null,
              origin: 'agent_proposed',
            }),
          });
          if (resp.ok) {
            const c = await resp.json();
            boostSucceeded = true;
            // Slot the boost approval into context
            mutate(prev => {
              if (!prev) return prev;
              return {
                ...prev,
                approvals: [...(prev.approvals || []), {
                  id: `boost-${c.id}`,
                  internalId: null,  // we don't have the Approval.id, but it'll appear after refresh
                  platform: c.platform,
                  title: `Boost: ${c.name}`,
                  draft: `$${(c.dailyBudgetCents/100).toFixed(0)}/day × ${c.durationDays} days ($${(c.plannedTotalCents/100).toFixed(0)} total) on ${c.platform}.`,
                  note: 'Proposed by your AI Agent — review in Approvals.',
                  kind: 'boost',

          console.error('[compose.boost] failed', e);

        }

              <Button variant="primary" icon="send"

    const monthLabel = 'May 2026';
    const firstWeekday = new Date(2026, 4, 1).getDay();
    const daysInMonth = 31;
    const cells = [];
    for (let i = 0; i < firstWeekday; i++) cells.push(null);
    for (let d = 1; d <= daysInMonth; d++) cells.push(d);
    while (cells.length % 7 !== 0) cells.push(null);

    const postsByDay = useMemo(() => {
      const map = {};
      posts.forEach(p => {

            {cells.map((d, i) => {
              const dayPosts = d ? (postsByDay[d] || []) : [];
              const isToday = d === 5;
              return (
                <div key={i} className={`border-r border-b border-surface-edge p-1.5 min-h-[88px] ${isToday ? 'bg-brand-50/40' : ''}`}>
                  {d && (
                    <>
                      <div className={`text-[11px] font-medium mb-1 px-1 ${isToday ? 'text-brand-600' : 'text-ink-faint'}`}>
                        {d}{isToday && <span className="ml-1 text-[10px] bg-brand-500 text-white px-1 rounded">Today</span>}
                      </div>
                      <div className="space-y-1">
                        {dayPosts.slice(0, 2).map(p => {
                          const plat = PLATFORMS[p.platform];
                          const stat = STATUSES[p.status];
                          const isSel = selected && selected.id === p.id;
                          return (
                            <button key={p.id} onClick={() => setSelectedId(p.id)}
                              className={`w-full text-left text-[11px] flex items-center gap-1 px-1.5 py-1 rounded ${isSel ? 'ring-2 ring-brand-500' : ''}`}
                              style={{ background: stat.dot + '22', color: stat.dot }}>
                              <span className="w-1.5 h-1.5 rounded-full shrink-0" style={{ background: plat.dot }}></span>
                              <span className="truncate">{p.title}</span>
                            </button>
                          );
                        })}
                        {dayPosts.length > 2 && (
                          <div className="text-[10px] text-ink-faint px-1.5">+{dayPosts.length - 2} more</div>
                        )}
                      </div>
                    </>
                  )}
                </div>
              );
            })}
          </div>
        </Card>
        {selected ? <PostDetail post={selected} onEdit={() => setEditing(selected)} /> : (
          <Card><div className="text-sm text-ink-soft">Click any post on the calendar to see the draft and the agent's reasoning.</div></Card>
        )}
        <PostEditModal post={editing} onClose={() => setEditing(null)} />
      </div>
    );
  };

  /* ============================================================
     PostEditModal — Phase B.2 edit-in-place via PUT /api/posts/:id
     Used by ScheduleTab (PostDetail) and DraftsTab. Stays mounted with
     null `post` until opened, so the modal animation works on close.
     ============================================================ */
  const PostEditModal = ({ post, onClose }) => {
    const mutate = useDashboardMutate();
    const [form, setForm] = useState({ title: '', draft: '', date: '' });
    const [saving, setSaving] = useState(false);
    const [error, setError] = useState(null);
    const [copied, setCopied] = useState(false);  // transient "Copied ✓" label swap

    useEffect(() => {
      if (post) {
        setForm({ title: post.title || '', draft: post.draft || '', date: post.date || '' });
        setError(null);
      }
    }, [post && post.id]);

    if (!post) return null;
    const isOffline = !post.internalId;
    const dirty = post && (
      form.title.trim() !== (post.title || '').trim()
      || form.draft.trim() !== (post.draft || '').trim()
      || form.date !== (post.date || '')
    );

    const save = async () => {
      if (!dirty || saving) return;
      if (isOffline) {
        setError("Backend is offline — edits won't persist.");
        return;
      }
      if (!form.title.trim() || !form.draft.trim()) {
        setError('Headline and draft are required.');
        return;
      }
      if (!/^\d{4}-\d{2}-\d{2}$/.test(form.date)) {
        setError('Schedule date must look like YYYY-MM-DD.');
        return;
      }

      setSaving(true);
      setError(null);
      // Optimistic patch: snapshot the row, mutate context, rollback on 5xx.
      let snapshot = null;
      mutate(prev => {
        if (!prev?.posts) return prev;
        const idx = prev.posts.findIndex(p => p.id === post.id);
        if (idx < 0) return prev;
        snapshot = prev.posts[idx];
        const nextPosts = prev.posts.slice();
        nextPosts[idx] = { ...snapshot, title: form.title.trim(), draft: form.draft.trim(), date: form.date };
        return { ...prev, posts: nextPosts };
      });

      try {
        const resp = await fetch(`/api/posts/${post.internalId}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            title: form.title.trim(),
            draft: form.draft.trim(),
            date: form.date,
          }),
        });
        if (!resp.ok) {
          const detail = await resp.json().catch(() => ({ detail: `HTTP ${resp.status}` }));
          throw new Error(detail.detail || `HTTP ${resp.status}`);
        }
        const json = await resp.json();
        // Reconcile with the canonical row from the server (in case the
        // backend normalized something we didn't).
        if (json.post) {
          mutate(prev => {
            if (!prev?.posts) return prev;
            const idx = prev.posts.findIndex(p => p.id === post.id);
            if (idx < 0) return prev;
            const nextPosts = prev.posts.slice();
            nextPosts[idx] = { ...nextPosts[idx], ...json.post };
            return { ...prev, posts: nextPosts };
          });
        }
        setSaving(false);
        onClose();
      } catch (e) {
        console.error('[posts.update] failed', e);
        if (snapshot) {
          mutate(prev => {
            if (!prev?.posts) return prev;
            const idx = prev.posts.findIndex(p => p.id === post.id);
            if (idx < 0) return prev;
            const nextPosts = prev.posts.slice();
            nextPosts[idx] = snapshot;
            return { ...prev, posts: nextPosts };
          });
        }
        setError(`Couldn't save — ${e.message || e}.`);
        setSaving(false);
      }
    };

    return (
      <Modal
        open={!!post}
        onClose={saving ? () => {} : onClose}
        title={`Edit "${post.title}"`}
        footer={<>
          {/* Copy needs no backend — stays enabled offline (isOffline). */}
          <Button icon="copy" variant="ghost" disabled={saving}
            onClick={() => copyTextToClipboard(form.draft, () => { setCopied(true); setTimeout(() => setCopied(false), 2000); })}>
            {copied ? 'Copied ✓' : 'Copy text'}
          </Button>
          <Button variant="ghost" onClick={onClose} disabled={saving}>Cancel</Button>
          <Button icon="check" variant="ok" onClick={save} disabled={!dirty || saving}>
            {saving ? 'Saving…' : 'Save changes'}
          </Button>
        </>}>
        <div className="space-y-4">
          {error && (
            <div className="px-3 py-2 rounded-lg bg-red-50 border border-red-200 text-sm text-bad flex items-start gap-2">
              <Icon name="alert" size={14} className="mt-0.5 shrink-0" />
              <div className="flex-1">{error}</div>
            </div>
          )}
          <div>
            <label className="text-xs uppercase tracking-wider font-medium text-ink-faint mb-1.5 block">Headline</label>
            <input
              className="w-full px-3 py-2 rounded-lg border border-surface-edge text-[15px] focus:outline-none focus:border-brand-500"
              value={form.title}
              onChange={(e) => setForm(f => ({ ...f, title: e.target.value }))}
            />
          </div>
          <div>
            <label className="text-xs uppercase tracking-wider font-medium text-ink-faint mb-1.5 block">Draft</label>
            <textarea
              className="w-full px-3 py-2 rounded-lg border border-surface-edge text-[15px] leading-relaxed focus:outline-none focus:border-brand-500"
              rows="8"
              value={form.draft}
              onChange={(e) => setForm(f => ({ ...f, draft: e.target.value }))}
            />
          </div>
          <div>
            <label className="text-xs uppercase tracking-wider font-medium text-ink-faint mb-1.5 block">Schedule date</label>
            <input
              type="date"
              className="px-3 py-2 rounded-lg border border-surface-edge text-[15px] focus:outline-none focus:border-brand-500"
              value={form.date}
              onChange={(e) => setForm(f => ({ ...f, date: e.target.value }))}
            />
            <p className="text-xs text-ink-faint mt-1">Posts move to whichever day you set here.</p>
          </div>
        </div>
      </Modal>
    );
  };

  /* ============================================================
     VIEW: APPROVALS QUEUE — Phase B.1 wired to /api/approvals/:id/decide
     ============================================================ */
  const ApprovalsView = ({ scrollToId, onScrollHandled }) => {
    const { approvals } = useDashboard();
    const mutate = useDashboardMutate();
    const [inFlight, setInFlight] = useState({});        // { [externalId]: true }
    const [editing, setEditing]   = useState(null);      // { item, draft }
    const [error, setError]       = useState(null);
    const [toast, setToast]       = useState(null);      // green success ribbon
    const [batching, setBatching] = useState(false);     // approve-all in flight
    const [highlightId, setHighlightId] = useState(null);

    // Phase B.7: when arrived-here-with-a-scroll-target, find the card and
    // scrollIntoView + set highlightId. The fade timer lives in a separate
    // effect (below) so this effect's cleanup — which runs when App clears
    // scrollToId via onScrollHandled — doesn't cancel the fade timeout.
    useEffect(() => {
      if (!scrollToId) return;
      const el = document.querySelector(`[data-scroll-id="${scrollToId}"]`);
      if (el) {
        el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        setHighlightId(scrollToId);
      }
      onScrollHandled?.();
    }, [scrollToId]);

    useEffect(() => {
      if (!highlightId) return;
      const t = setTimeout(() => setHighlightId(null), 1600);
      return () => clearTimeout(t);
    }, [highlightId]);

    useEffect(() => {
      if (!toast) return;
      const t = setTimeout(() => setToast(null), 4000);
      return () => clearTimeout(t);
    }, [toast]);

    // Real decide path. Optimistically removes the card; on failure, rolls back
    // by re-injecting the original approvals list and surfacing the error.
    // Returns true on success, false on failure (error state already set).
    const decide = async (item, choice, editedDraft) => {
      if (inFlight[item.id]) return false;
      if (!item.internalId) {
        setError("This is demo data — backend is offline, decisions won't persist.");
        return false;
      }

      setInFlight(f => ({ ...f, [item.id]: true }));
      setError(null);
      // Optimistic remove: snapshot the previous list so we can rollback.
      let snapshot = null;
      mutate(prev => {
        snapshot = prev.approvals;
        return { ...prev, approvals: prev.approvals.filter(a => a.id !== item.id) };
      });

      try {
        const resp = await fetch(`/api/approvals/${item.internalId}/decide`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            decision: choice,
            edited_draft: choice === 'edit' ? (editedDraft || '') : undefined,
          }),
        });
        if (!resp.ok) {
          const detail = await resp.json().catch(() => ({ detail: `HTTP ${resp.status}` }));
          throw new Error(detail.detail || `HTTP ${resp.status}`);
        }
        const json = await resp.json();
        // On approve/edit of a post-kind, the backend materialized a new Post.
        // Slot it into posts[] so Calendar/Compose see it immediately.
        if (json.post) {
          mutate(prev => prev ? ({ ...prev, posts: [...(prev.posts || []), json.post] }) : prev);
        }
        // On approve/edit of a review-kind, update the Review row in-place.
        if (json.review) {
          mutate(prev => {
            if (!prev?.reviews) return prev;
            const updateOne = (r) => r.id === json.review.id
              ? { ...r, response: json.review.ownerResponse }
              : r;
            return {
              ...prev,
              reviews: {
                ...prev.reviews,
                recent: (prev.reviews.recent || []).map(updateOne),
                pinned: prev.reviews.pinned && prev.reviews.pinned.id === json.review.id
                  ? { ...prev.reviews.pinned, response: json.review.ownerResponse }
                  : prev.reviews.pinned,
              },
            };
          });
        }
        return true;
      } catch (e) {
        console.error('[approvals.decide] failed', e);
        // Rollback to the snapshot
        if (snapshot) mutate(prev => ({ ...prev, approvals: snapshot }));
        setError(`Couldn't ${choice} "${item.title}" — ${e.message || e}.`);
        return false;
      } finally {
        setInFlight(f => { const { [item.id]: _, ...rest } = f; return rest; });
        if (editing && editing.item.id === item.id) setEditing(null);
      }
    };

    // Approve-all: post-kind only, sequential, halt-on-error.
    // Review-kind approvals (negative-review replies) are touchier — they get
    // skipped and surfaced in the toast so owner still eyeballs them.
    const approveAll = async () => {
      if (batching) return;
      const posts   = approvals.filter(a => a.kind !== 'review');
      const reviews = approvals.filter(a => a.kind === 'review');
      if (posts.length === 0) {
        setToast(reviews.length
          ? `Nothing to batch-approve — the ${reviews.length} review repl${reviews.length === 1 ? 'y needs' : 'ies need'} your eye individually.`
          : "Queue is already clear.");
        return;
      }
      setBatching(true);
      setError(null);
      let approved = 0;
      for (const item of posts) {
        const ok = await decide(item, 'approve');
        if (!ok) break;            // halt the chain; remaining stay queued
        approved += 1;
      }
      setBatching(false);
      if (approved === posts.length) {
        const skipped = reviews.length;
        setToast(`Approved ${approved} post${approved === 1 ? '' : 's'}.${
          skipped ? ` ${skipped} review repl${skipped === 1 ? 'y' : 'ies'} still need${skipped === 1 ? 's' : ''} your eye.` : ''
        }`);
      }
      // If approved < posts.length, decide() already set the error banner.
    };

    const pendingCount = approvals.length;

    return (
      <div className="fade-in">
        <TopBar
          breadcrumb="Workspace"
          title="Approvals queue"
          subtitle={pendingCount === 0
            ? "Inbox zero. Nothing waiting for your sign-off right now."
            : `${pendingCount} item${pendingCount === 1 ? '' : 's'} waiting for your sign-off. Approve, edit, or reject — your call.`}
          right={
            <div className="flex items-center gap-2">
              <Pill color={pendingCount === 0 ? 'emerald' : 'amber'}>
                {pendingCount === 0 ? 'All clear' : `${pendingCount} pending`}
              </Pill>
              <Button variant="secondary" size="sm" icon="check"
                onClick={approveAll}
                disabled={pendingCount === 0 || batching}>
                {batching ? 'Approving…' : 'Approve all'}
              </Button>
            </div>
          }
        />
        {error && (
          <div className="mx-8 mt-5 px-4 py-3 rounded-lg bg-red-50 border border-red-200 text-sm text-bad flex items-start gap-2">
            <Icon name="alert" size={16} className="mt-0.5 shrink-0" />
            <div className="flex-1">{error}</div>
            <button className="text-bad/60 hover:text-bad" onClick={() => setError(null)}>
              <Icon name="x" size={14} />
            </button>
          </div>
        )}
        {toast && (
          <div className="mx-8 mt-5 px-4 py-3 rounded-lg bg-emerald-50 border border-emerald-200 text-sm text-emerald-800 flex items-start gap-2">
            <Icon name="check" size={16} className="mt-0.5 shrink-0" />
            <div className="flex-1">{toast}</div>
            <button className="text-emerald-700/60 hover:text-emerald-800" onClick={() => setToast(null)}>
              <Icon name="x" size={14} />
            </button>
          </div>
        )}
        {pendingCount === 0 && !error && (
          <div className="px-8 py-16 text-center">
            <div className="inline-flex items-center justify-center w-14 h-14 rounded-full bg-emerald-50 text-emerald-600 mb-3">
              <Icon name="check" size={26} strokeWidth={2.2} />
            </div>
            <h3 className="font-semibold text-ink">Approvals inbox is clear</h3>
            <p className="text-sm text-ink-soft mt-1">When the agent drafts something new, it'll show up here for your sign-off.</p>
          </div>
        )}
        <div className="px-8 py-7 grid grid-cols-1 lg:grid-cols-2 gap-5">
          {approvals.map(item => {
            const busy = !!inFlight[item.id];
            return (
            <Card key={item.id} padded={false}
              data-scroll-id={item.id}
              className={`overflow-hidden transition-all ${busy ? 'opacity-50' : ''} ${highlightId === item.id ? 'ring-2 ring-brand-500 ring-offset-2' : ''}`}>
              <div className="p-5 border-b border-surface-edge flex items-center justify-between">
                <div className="flex items-center gap-2">
                  <PlatformChip platform={item.platform} />
                  {item.kind === 'review' && <Pill color="red" icon="alert">Review reply</Pill>}
                  {item.kind === 'boost'  && <Pill color="violet" icon="dollar">Boost proposal</Pill>}
                  {(!item.kind || item.kind === 'post') && <Pill color="amber">Pending</Pill>}
                </div>
                {busy && <Pill color="slate" icon="refresh">Saving…</Pill>}
              </div>
              <div className="p-5 space-y-4">
                <h3 className="font-semibold text-ink">{item.title}</h3>
                {item.original && (
                  <div className="bg-red-50 border border-red-100 rounded-lg p-3">
                    <div className="text-xs uppercase tracking-wider text-bad font-semibold mb-1 flex items-center gap-1">
                      <Icon name="alert" size={11} strokeWidth={2.4} />
                      {[
                        item.author || 'A customer',
                        item.stars ? `left this ${item.stars}★ review` : 'left this review',
                        item.when || 'recently',
                      ].join(' ')}
                    </div>
                    <p className="text-sm text-ink italic">"{item.original}"</p>
                  </div>
                )}
                {!item.original && item.kind !== 'boost' && (
                  <div className="bg-surface rounded-lg border border-surface-edge h-28 flex items-center justify-center text-ink-faint">
                    <Icon name="image" size={28} strokeWidth={1.5} />
                    <span className="ml-2 text-xs">Image placeholder — owner-provided</span>
                  </div>
                )}
                {item.kind === 'boost' && (
                  <div className="bg-violet-50 border border-violet-100 rounded-lg p-3">
                    <div className="text-xs uppercase tracking-wider text-violet-700 font-semibold mb-1 flex items-center gap-1">
                      <Icon name="dollar" size={11} strokeWidth={2.4} />
                      Paid spend — your AI agent is proposing this campaign
                    </div>
                    <p className="text-sm text-ink leading-relaxed">{item.draft}</p>
                  </div>
                )}
                {item.kind !== 'boost' && (
                  <div>
                    <div className="text-xs uppercase tracking-wider text-ink-faint font-medium mb-1.5">{item.kind === 'review' ? 'Drafted reply' : 'Draft'}</div>
                    <p className="text-sm text-ink leading-relaxed bg-white rounded-lg p-3 border border-surface-edge whitespace-pre-line">{item.draft}</p>
                  </div>
                )}
                <div className="flex gap-2 items-start text-xs">
                  <div className="shrink-0 mt-0.5"><Icon name="sparkles" size={13} className="text-brand-500" /></div>
                  <p className="text-ink-soft italic leading-relaxed flex-1">{item.note}</p>
                </div>
                <div className="flex items-center gap-2 pt-1">
                  <Button icon="check" variant="ok" className="flex-1"
                    disabled={busy}
                    onClick={() => decide(item, 'approve')}>Approve</Button>
                  <Button icon="edit" variant="secondary"
                    disabled={busy}
                    onClick={() => setEditing({ item, draft: item.draft })}>Edit</Button>
                  {/* Copy bridge: real publishing is still mocked/dormant, so
                      the honest path to "post this" is approve → copy → paste
                      into the platform. Needs no backend — never disabled by busy. */}
                  <Button icon="copy" variant="ghost"
                    onClick={() => copyTextToClipboard(item.draft,
                      () => setToast(`Post text copied — paste into ${(PLATFORMS[item.platform] || {}).label || 'your platform'}.`),
                      () => setToast("Couldn't copy — select the draft text and copy manually."))}>Copy</Button>
                  <Button icon="x" variant="ghost"
                    disabled={busy}
                    onClick={() => decide(item, 'reject')}>Reject</Button>
                </div>
              </div>
            </Card>
            );
          })}
        </div>

        {/* Edit modal — owner tweaks the agent's draft, then saves & approves
            in a single click. Cancel preserves the unchanged draft and returns
            the card to the queue. */}
        <Modal
          open={!!editing}
          onClose={() => setEditing(null)}
          title={editing ? `Edit "${editing.item.title}"` : ''}
          footer={editing && <>
            <Button variant="ghost" onClick={() => setEditing(null)}>Cancel</Button>
            <Button icon="check" variant="ok"
              disabled={!editing.draft.trim() || !!inFlight[editing.item.id]}
              onClick={() => decide(editing.item, 'edit', editing.draft)}>
              Save & approve
            </Button>
          </>}>
          {editing && (
            <div className="space-y-3">
              <div className="text-xs uppercase tracking-wider font-medium text-ink-faint">
                {editing.item.kind === 'review' ? 'Reply draft' : 'Post draft'} · {editing.item.platform.toUpperCase()}
              </div>
              <textarea
                className="w-full px-3 py-2 rounded-lg border border-surface-edge text-[15px] leading-relaxed focus:outline-none focus:border-brand-500"
                rows="8"
                value={editing.draft}
                onChange={(e) => setEditing(ed => ed ? { ...ed, draft: e.target.value } : ed)}
              />
              <p className="text-xs text-ink-faint">
                Your edit replaces the agent's draft. Saving here both updates and approves it in one step.
              </p>
            </div>
          )}
        </Modal>
      </div>
    );
  };

  /* ============================================================
     VIEW: PERFORMANCE — Network reach sub-tab (Phase D.3 + D.4)
     ============================================================ */

            <div>
              <div className="text-xs uppercase tracking-wider font-semibold text-violet-700 mb-1 inline-flex items-center gap-1.5">
                <Icon name="globe" size={11} strokeWidth={2.4} /> Network add-on
              </div>

          {!tr.hasData && (

                When you publish your first amplified post (Regional, Network, or Maximum tier on Compose), this view will populate with per-territory impressions and the 65 / 25 / 10 revenue split.
              </p>
              <div className="mt-4 pt-4 border-t border-violet-200/60 grid grid-cols-3 gap-3 text-[10px] uppercase tracking-wider font-semibold">
                <div className="text-violet-700">
                  <div className="text-violet-900 text-base font-semibold normal-case tracking-normal">65%</div>
                  Selling publisher

          // FastAPI 422 returns detail as a list of {loc, msg, type} objects;
          // grab the first msg so the banner doesn't read "[object Object]".
          let msg = `HTTP ${r.status}`;
          if (Array.isArray(j.detail) && j.detail[0]?.msg) msg = j.detail[0].msg;
          else if (typeof j.detail === 'string') msg = j.detail;
          return Promise.reject(new Error(msg));

  const AD_PLATFORMS = [
    { key: 'fb_ig',      label: 'Meta',     fullLabel: 'Meta (FB + IG)',           icon: 'fb',       accent: 'sky',    cpm: 8.00,  ctrPct: 1.2 },
    { key: 'google_ads', label: 'Google',   fullLabel: 'Google Ads',                icon: 'google',   accent: 'emerald',cpm: 15.00, ctrPct: 3.5 },
    { key: 'tiktok',     label: 'TikTok',   fullLabel: 'TikTok Ads',                icon: 'sparkles', accent: 'rose',   cpm: 6.00,  ctrPct: 1.8 },
    { key: 'linkedin',   label: 'LinkedIn', fullLabel: 'LinkedIn Ads',              icon: 'user',     accent: 'indigo', cpm: 35.00, ctrPct: 0.9 },
  ];
  const AD_PLATFORM_BY_KEY = Object.fromEntries(AD_PLATFORMS.map(p => [p.key, p]));

  const formatUSD = (cents, options = {}) => {
    const { showCents = false } = options;
    return '$' + (cents / 100).toLocaleString(undefined, {
      minimumFractionDigits: showCents ? 2 : 0,
      maximumFractionDigits: showCents ? 2 : 0,
    });
  };

  const AdsView = ({ onNavigate }) => {
    const { business } = useDashboard();
    const [adsState, setAdsState] = useState(null);
    const [loading, setLoading] = useState(true);
    const [error, setError] = useState(null);
    const [tab, setTab] = useState('overview');
    const [ticking, setTicking] = useState(false);
    const [savingPlatform, setSavingPlatform] = useState(null);
    const [draftCaps, setDraftCaps] = useState({});  // platform → string while typing
    const [newCampaign, setNewCampaign] = useState(null);  // null or {platform, name, daily, days, audience}
    const [creatingCampaign, setCreatingCampaign] = useState(false);
    const [savingDecision, setSavingDecision] = useState(null);  // campaign id while updating

    const refresh = useCallback(async () => {
      try {
        const r = await fetch('/api/ads');
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        const data = await r.json();
        setAdsState(data);
        setError(null);
      } catch (e) {
        console.error('[ads.refresh]', e);
        setError(`Couldn't load ads data: ${e.message || e}`);
      } finally {
        setLoading(false);
      }
    }, []);

    useEffect(() => { refresh(); }, [refresh]);

    const handleTick = async () => {
      if (ticking) return;
      setTicking(true);
      try {
        const r = await fetch('/api/ads/tick?hours=24', { method: 'POST' });
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        await refresh();
      } catch (e) {
        console.error('[ads.tick]', e);
        setError(`Simulator failed: ${e.message || e}`);
      } finally {
        setTicking(false);
      }
    };

    const createCampaign = async () => {
      if (!newCampaign || creatingCampaign) return;
      const dailyCents = Math.max(100, Math.round(parseFloat(newCampaign.daily || '0') * 100));
      const days = Math.max(1, Math.min(90, parseInt(newCampaign.days || '0', 10) || 0));
      if (!newCampaign.name?.trim() || !newCampaign.platform || dailyCents < 100 || days < 1) {
        setError('Campaign needs a name, platform, daily budget ≥ $1, and at least 1 day.');
        return;
      }
      setCreatingCampaign(true);
      try {
        const r = await fetch('/api/ads/campaigns', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            platform: newCampaign.platform,
            name: newCampaign.name.trim(),
            daily_budget_cents: dailyCents,
            duration_days: days,
            target_audience: newCampaign.audience?.trim() || null,
            origin: 'manual_owner',
          }),
        });
        if (!r.ok) {
          const j = await r.json().catch(() => ({ detail: `HTTP ${r.status}` }));
          throw new Error(typeof j.detail === 'string' ? j.detail : `HTTP ${r.status}`);
        }
        setNewCampaign(null);
        await refresh();
      } catch (e) {
        console.error('[ads.createCampaign]', e);
        setError(`Couldn't create campaign: ${e.message || e}`);
      } finally {
        setCreatingCampaign(false);
      }
    };

    const updateCampaign = async (campaignId, body) => {
      setSavingDecision(campaignId);
      try {
        const r = await fetch(`/api/ads/campaigns/${campaignId}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        if (!r.ok) {
          const j = await r.json().catch(() => ({ detail: `HTTP ${r.status}` }));
          throw new Error(typeof j.detail === 'string' ? j.detail : `HTTP ${r.status}`);
        }
        await refresh();
      } catch (e) {
        console.error('[ads.updateCampaign]', e);
        setError(`Couldn't update campaign: ${e.message || e}`);
      } finally {
        setSavingDecision(null);
      }
    };

    const saveCap = async (platform, dollarsStr) => {
      const cents = Math.max(0, Math.round(parseFloat(dollarsStr || '0') * 100) || 0);
      setSavingPlatform(platform);
      try {
        const r = await fetch(`/api/ads/budgets/${platform}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ monthly_cap_cents: cents }),
        });
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        await refresh();
        setDraftCaps(d => { const { [platform]: _, ...rest } = d; return rest; });
      } catch (e) {
        console.error('[ads.saveCap]', e);
        setError(`Couldn't save cap: ${e.message || e}`);
      } finally {
        setSavingPlatform(null);
      }
    };

    if (loading && !adsState) {
      return (
        <div className="fade-in">
          <TopBar breadcrumb="Workspace" title="Ads & Spend" subtitle="Loading…" />

    const a = adsState || { budgets: [], campaigns: [], connections: [], totalCapCents: 0, totalSpendCents: 0, activeCount: 0, pendingCount: 0, totalImpressions: 0, totalClicks: 0, avgCtr: 0, hasAnyCap: false, hasAnyCampaign: false, hasAnyConnection: false };

    const titles = {
      overview:    { title: 'Ads & Spend',        subtitle: 'Set monthly caps per platform, watch active campaigns, and tune budgets.' },
      campaigns:   { title: 'Campaigns',          subtitle: 'Every active, scheduled, paused, and completed campaign across all platforms.' },
      performance: { title: 'Performance by platform', subtitle: 'CTR · spend · ROAS across Meta, Google, TikTok, LinkedIn.' },
      history:     { title: 'Campaign history',   subtitle: 'Completed and cancelled campaigns. Auditable record of every dollar.' },
    };
    const adTabs = [
      { id: 'overview',    label: 'Overview',    icon: 'chart' },
      { id: 'campaigns',   label: 'Campaigns',   icon: 'inbox', count: a.activeCount + a.pendingCount },
      { id: 'performance', label: 'Performance', icon: 'trending' },
      { id: 'history',     label: 'History',     icon: 'clock' },
    ];

    const activeCampaigns  = a.campaigns.filter(c => c.status === 'active' || c.status === 'scheduled');
    const pendingCampaigns = a.campaigns.filter(c => c.status === 'pending_approval');
    const pausedCampaigns  = a.campaigns.filter(c => c.status === 'paused');

    const connectionFor = (platform) => a.connections.find(c => c.platform === platform);
    const budgetFor     = (platform) => a.budgets.find(b => b.platform === platform);

    return (
      <div className="fade-in">
        <TopBar

        <div className="px-8 pt-2"><TabBar tabs={adTabs} value={tab} onChange={setTab} /></div>

            <button className="text-bad/60 hover:text-bad" onClick={() => setError(null)}>
              <Icon name="x" size={14} />

        <div className="px-8 py-7">
          {/* Top stat row — visible on all tabs */}
          <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
            <StatTile label="Total spend (this month)"
              value={a.hasAnyCampaign ? formatUSD(a.totalSpendCents) : '$0'}

            <StatTile label="Active campaigns"
              value={String(a.activeCount)}

              positive={a.activeCount > 0} />
            <StatTile label="Total impressions"
              value={a.totalImpressions > 0 ? a.totalImpressions.toLocaleString() : '—'}

            <StatTile label="Avg CTR"
              value={a.avgCtr > 0 ? `${(a.avgCtr * 100).toFixed(2)}%` : '—'}

          </div>

          {tab === 'overview' && (
            <div className="grid grid-cols-1 lg:grid-cols-[1fr_360px] gap-5 fade-in">
              {/* LEFT: Budget allocator + active campaigns */}
              <div className="space-y-5">
                <Card>
                  <SectionHeader title="Monthly budget caps" subtitle="One cap per platform — independent. Caps reset on the 1st of every month." />
                  <div className="space-y-3">
                    {AD_PLATFORMS.map(p => {
                      const conn = connectionFor(p.key);
                      const budget = budgetFor(p.key);
                      const capCents = budget?.monthlyCapCents || 0;
                      const spendCents = budget?.spendCents || 0;
                      const pctUsed = capCents > 0 ? Math.min(100, (spendCents / capCents) * 100) : 0;

                      return (
                        <div key={p.key} className="rounded-lg border border-surface-edge p-3">
                          <div className="flex items-center gap-3 mb-2">
                            <div className={`w-8 h-8 rounded-lg bg-${p.accent}-50 text-${p.accent}-600 flex items-center justify-center shrink-0`}>
                              <Icon name={p.icon} size={15} />

                            <div className="flex-1 min-w-0">
                              <div className="text-sm font-semibold text-ink">{p.fullLabel}</div>
                              <div className="text-[11px] text-ink-faint">

                            </div>
                            {!isConnected && (

                          {capCents > 0 && (

                          {capCents === 0 && !isConnected && (
                            <div className="mt-2 text-[11px] text-ink-faint italic">
                              Set a cap to start planning. Connect your {p.label} ad account in Settings to schedule live campaigns.
                            </div>
                          )}
                        </div>
                      );
                    })}
                  </div>
                </Card>

                <Card>
                  <SectionHeader title="Active + scheduled campaigns" subtitle={`${activeCampaigns.length} live · ${pendingCampaigns.length} pending approval · ${pausedCampaigns.length} paused`} />
                  {!a.hasAnyCampaign && (
                    <div className="border-2 border-dashed border-brand-200 rounded-xl px-4 py-8 text-center bg-brand-50/30">
                      <div className="inline-flex items-center justify-center w-12 h-12 rounded-full bg-brand-100 text-brand-600 mb-3">
                        <Icon name="sparkles" size={22} strokeWidth={1.8} />
                      </div>
                      <h4 className="font-semibold text-ink text-sm mb-1">No campaigns yet</h4>
                      <p className="text-xs text-ink-soft max-w-sm mx-auto leading-relaxed">
                        Set a monthly cap on at least one platform (left), then either create a campaign directly from this tab or boost a post on launch from <button className="text-brand-600 hover:underline" onClick={() => onNavigate('compose')}>Compose</button>.
                      </p>
                      {business.tier >= 3 && (
                        <p className="text-[11px] text-violet-700 mt-3 italic">
                          Your AI Agent can autonomously schedule campaigns within your caps — just ask.
                        </p>
                      )}
                    </div>
                  )}
                  {a.hasAnyCampaign && activeCampaigns.length === 0 && pendingCampaigns.length === 0 && (
                    <div className="py-6 text-center text-ink-faint text-sm">
                      No active or pending campaigns. {pausedCampaigns.length > 0 && <>Check the History tab for paused ones.</>}
                    </div>
                  )}
                  {(activeCampaigns.length > 0 || pendingCampaigns.length > 0) && (
                    <div className="overflow-x-auto -mx-4 sm:mx-0">
                      <table className="w-full text-sm">
                        <thead>
                          <tr className="text-left text-[10px] uppercase tracking-wider text-ink-faint font-semibold border-b border-surface-edge">
                            <th className="py-2 px-2">Campaign</th>
                            <th className="py-2 px-2">Platform</th>
                            <th className="py-2 px-2 text-right">Budget</th>
                            <th className="py-2 px-2 text-right">Spent</th>
                            <th className="py-2 px-2 text-right">Impr.</th>
                            <th className="py-2 px-2 text-right">CTR</th>
                            <th className="py-2 px-2">Status</th>
                          </tr>
                        </thead>
                        <tbody>
                          {[...activeCampaigns, ...pendingCampaigns].map(c => (
                            <CampaignRow key={c.id} c={c} />

                      </table>
                    </div>

                </Card>

              {/* RIGHT: Platform connections summary + agent note */}
              <div className="space-y-5">
                <Card>
                  <SectionHeader title="Platform connections" subtitle="OAuth your ad accounts to schedule live campaigns." />
                  <ul className="divide-y divide-surface-edge">
                    {AD_PLATFORMS.map(p => {
                      const conn = connectionFor(p.key);
                      const isConnected = conn?.status === 'connected';
                      return (
                        <li key={p.key} className="py-2.5 flex items-center gap-3">
                          <div className={`w-7 h-7 rounded-lg bg-${p.accent}-50 text-${p.accent}-600 flex items-center justify-center shrink-0`}>
                            <Icon name={p.icon} size={13} />
                          </div>
                          <div className="flex-1 min-w-0">
                            <div className="text-sm font-medium text-ink truncate">{p.label}</div>
                            <div className="text-[11px] text-ink-faint truncate">
                              {isConnected ? (conn.externalAccountId || 'Connected') : 'Not connected'}
                            </div>
                          </div>
                          {isConnected ? (
                            <Pill color="emerald">On</Pill>

                            <button className="text-xs text-brand-600 hover:underline" onClick={() => onNavigate('settings')}>
                              Connect →
                            </button>
                          )}
                        </li>
                      );

                  </ul>
                </Card>

                <Card>
                  <SectionHeader title={business.tier >= 3 ? "Autonomous mode" : "Agent recommendations"}

                  <p className="text-sm text-ink-soft leading-relaxed">
                    {business.tier >= 3
                      ? "Your AI Agent can autonomously allocate spend within the caps you set. Each campaign it schedules shows up in the Campaigns tab tagged as auto-scheduled."
                      : "On your current plan, the agent can propose boosts but you'll always be the one to click 'Approve' before any money moves."}
                  </p>
                  <button onClick={() => onNavigate('chat')}
                    className="mt-3 w-full px-3 py-2 rounded-lg bg-brand-50 text-brand-700 text-sm font-medium hover:bg-brand-100 transition-all">
                    Open AI Agent →
                  </button>
                </Card>
              </div>
            </div>
          )}

          {tab === 'campaigns' && (
            <Card>
              <SectionHeader title="All campaigns" subtitle="Use the Status filter pills to drill in." />
              {!a.hasAnyCampaign ? (
                <div className="py-10 text-center text-ink-faint text-sm">
                  No campaigns yet. Create one from <button className="text-brand-600 hover:underline" onClick={() => onNavigate('compose')}>Compose</button>, or set a budget cap above and ask your AI Agent.
                </div>
              ) : (
                <div className="overflow-x-auto -mx-4 sm:mx-0">
                  <table className="w-full text-sm">
                    <thead>
                      <tr className="text-left text-[10px] uppercase tracking-wider text-ink-faint font-semibold border-b border-surface-edge">
                        <th className="py-2 px-2">Campaign</th>
                        <th className="py-2 px-2">Platform</th>
                        <th className="py-2 px-2 text-right">Budget</th>
                        <th className="py-2 px-2 text-right">Spent</th>
                        <th className="py-2 px-2 text-right">Impr.</th>
                        <th className="py-2 px-2 text-right">CTR</th>
                        <th className="py-2 px-2">Status</th>
                      </tr>
                    </thead>
                    <tbody>
                      {a.campaigns.map(c => <CampaignRow key={c.id} c={c} />)}
                    </tbody>
                  </table>
                </div>
              )}
            </Card>
          )}

          {tab === 'performance' && (
            <AdsPerformanceTab adsState={a} />
          )}

          {tab === 'history' && (
            <Card>
              <SectionHeader title="Completed + cancelled campaigns" subtitle="Auditable record of every dollar." />
              {[...a.campaigns.filter(c => ['completed','cancelled','paused'].includes(c.status))].length === 0 ? (
                <div className="py-10 text-center text-ink-faint text-sm">No archived campaigns yet.</div>
              ) : (
                <div className="overflow-x-auto -mx-4 sm:mx-0">
                  <table className="w-full text-sm">
                    <thead>
                      <tr className="text-left text-[10px] uppercase tracking-wider text-ink-faint font-semibold border-b border-surface-edge">
                        <th className="py-2 px-2">Campaign</th>
                        <th className="py-2 px-2">Platform</th>
                        <th className="py-2 px-2 text-right">Final spend</th>
                        <th className="py-2 px-2 text-right">Impr.</th>
                        <th className="py-2 px-2 text-right">CTR</th>
                        <th className="py-2 px-2">Status</th>
                      </tr>
                    </thead>
                    <tbody>
                      {a.campaigns.filter(c => ['completed','cancelled','paused'].includes(c.status)).map(c => <CampaignRow key={c.id} c={c} compact />)}
                    </tbody>
                  </table>
                </div>
              )}
            </Card>
          )}
        </div>

        {/* New campaign modal — owner-initiated creation. Submits as
            manual_owner (lands scheduled). The Compose 'Boost on launch'
            card uses a different path that goes via Approvals. */}
        <Modal
          open={!!newCampaign}
          onClose={() => setNewCampaign(null)}
          title="New campaign"
          footer={
            newCampaign && (
              <>
                <Button variant="ghost" onClick={() => setNewCampaign(null)} disabled={creatingCampaign}>Cancel</Button>
                <Button icon="send" variant="primary"
                  onClick={createCampaign}
                  disabled={creatingCampaign || !newCampaign.name?.trim()}>
                  {creatingCampaign ? 'Scheduling…' : 'Schedule campaign'}
                </Button>
              </>
            )
          }>
          {newCampaign && (
            <div className="space-y-4">
              <div>
                <label className="text-xs uppercase tracking-wider font-semibold text-ink-faint mb-1.5 block">Platform</label>
                <div className="grid grid-cols-2 gap-2">
                  {AD_PLATFORMS.map(p => {
                    const on = newCampaign.platform === p.key;
                    return (
                      <button key={p.key}
                        onClick={() => setNewCampaign(nc => ({ ...nc, platform: p.key }))}
                        className={`px-3 py-2 rounded-lg border-2 text-left transition-all flex items-center gap-2 ${
                          on ? `border-brand-500 bg-brand-50` : 'border-surface-edge hover:border-ink-faint/40'
                        }`}>
                        <div className={`w-7 h-7 rounded-lg bg-${p.accent}-50 text-${p.accent}-600 flex items-center justify-center shrink-0`}>
                          <Icon name={p.icon} size={13} />
                        </div>
                        <div className="min-w-0">
                          <div className="text-sm font-medium text-ink truncate">{p.label}</div>
                          <div className="text-[10px] text-ink-faint">${p.cpm.toFixed(2)} CPM</div>
                        </div>
                      </button>
                    );
                  })}
                </div>
              </div>
              <div>
                <label className="text-xs uppercase tracking-wider font-semibold text-ink-faint mb-1.5 block">Campaign name</label>
                <input value={newCampaign.name}
                  onChange={e => setNewCampaign(nc => ({ ...nc, name: e.target.value }))}
                  placeholder="e.g. Quadd free-trial — Week 1 push"
                  className="w-full px-3 py-2 rounded-lg border border-surface-edge text-[15px] focus:outline-none focus:border-brand-500" />
              </div>
              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="text-xs uppercase tracking-wider font-semibold text-ink-faint mb-1.5 block">Daily budget</label>
                  <div className="relative">
                    <span className="absolute left-2.5 top-1/2 -translate-y-1/2 text-ink-faint text-sm">$</span>
                    <input type="number" min="1" step="5"
                      value={newCampaign.daily}
                      onChange={e => setNewCampaign(nc => ({ ...nc, daily: e.target.value }))}
                      className="w-full pl-6 pr-12 py-2 rounded-lg border border-surface-edge text-[15px] focus:outline-none focus:border-brand-500" />
                    <span className="absolute right-2.5 top-1/2 -translate-y-1/2 text-ink-faint text-xs">/day</span>
                  </div>
                </div>
                <div>
                  <label className="text-xs uppercase tracking-wider font-semibold text-ink-faint mb-1.5 block">Duration</label>
                  <div className="relative">
                    <input type="number" min="1" max="90"
                      value={newCampaign.days}
                      onChange={e => setNewCampaign(nc => ({ ...nc, days: e.target.value }))}
                      className="w-full pl-3 pr-12 py-2 rounded-lg border border-surface-edge text-[15px] focus:outline-none focus:border-brand-500" />
                    <span className="absolute right-2.5 top-1/2 -translate-y-1/2 text-ink-faint text-xs">days</span>
                  </div>
                </div>
              </div>
              <div>
                <label className="text-xs uppercase tracking-wider font-semibold text-ink-faint mb-1.5 block">Audience hint <span className="text-ink-faint normal-case font-normal">(optional)</span></label>
                <textarea rows="2"
                  value={newCampaign.audience || ''}
                  onChange={e => setNewCampaign(nc => ({ ...nc, audience: e.target.value }))}
                  placeholder="e.g. Newspaper publishers + editors, 50-mile radius around New Ulm"
                  className="w-full px-3 py-2 rounded-lg border border-surface-edge text-[14px] focus:outline-none focus:border-brand-500 resize-none" />
              </div>
              <div className="text-[11px] text-ink-soft bg-surface rounded-lg p-3 leading-relaxed">
                Planned spend: <strong>${((parseFloat(newCampaign.daily || '0') * parseInt(newCampaign.days || '0', 10)) || 0).toLocaleString()}</strong>
                {' '}over {parseInt(newCampaign.days || '0', 10) || 0} days. The campaign will start immediately as
                <strong> scheduled</strong> and become <strong>active</strong> on the next 'Simulate today' tick.
              </div>
            </div>
          )}
        </Modal>
      </div>
    );
  };

  // Phase E.5 — per-platform performance breakdown. Aggregates campaign
  // performance by platform, renders side-by-side bar charts for spend,
  // impressions, CTR. Empty state shows the value prop with $0 chips.
  const AdsPerformanceTab = ({ adsState }) => {
    const a = adsState;
    // Aggregate per-platform: spend, impressions, clicks, CTR, ROAS-ish.
    const perPlatform = AD_PLATFORMS.map(p => {
      const campaigns = a.campaigns.filter(c => c.platform === p.key);
      const spend = campaigns.reduce((s, c) => s + c.actualSpendCents, 0);
      const impressions = campaigns.reduce((s, c) => s + ((c.performance || {}).impressions || 0), 0);
      const clicks = campaigns.reduce((s, c) => s + ((c.performance || {}).clicks || 0), 0);
      const ctr = impressions > 0 ? clicks / impressions : 0;
      const budgetRow = a.budgets.find(b => b.platform === p.key);
      const cap = budgetRow?.monthlyCapCents || 0;
      return { ...p, spend, impressions, clicks, ctr, cap, count: campaigns.length };
    });
    const maxSpend = Math.max(1, ...perPlatform.map(p => p.spend));
    const maxImp   = Math.max(1, ...perPlatform.map(p => p.impressions));
    const maxCtr   = Math.max(0.001, ...perPlatform.map(p => p.ctr));
    const anyData  = perPlatform.some(p => p.spend > 0 || p.impressions > 0);

    return (
      <div className="grid grid-cols-1 lg:grid-cols-2 gap-5 fade-in">
        {/* Spend by platform — horizontal bar chart */}
        <Card>
          <SectionHeader title="Spend by platform" subtitle="This month's actual outflow per ad platform." />
          {!anyData ? (
            <div className="border-2 border-dashed border-amber-200 rounded-xl px-4 py-8 text-center bg-amber-50/30">
              <div className="inline-flex items-center justify-center w-12 h-12 rounded-full bg-amber-100 text-amber-600 mb-3">
                <Icon name="dollar" size={22} strokeWidth={1.8} />
              </div>
              <h4 className="font-semibold text-ink text-sm mb-1">No spend yet</h4>
              <p className="text-xs text-ink-soft max-w-sm mx-auto leading-relaxed">
                Schedule a campaign and click 'Simulate today' to see per-platform spend roll up here.
              </p>
            </div>
          ) : (
            <div className="space-y-2">
              {perPlatform.map(p => (
                <div key={p.key}>
                  <div className="flex items-center justify-between text-xs mb-1">
                    <div className="flex items-center gap-1.5">
                      <div className={`w-5 h-5 rounded bg-${p.accent}-50 text-${p.accent}-600 flex items-center justify-center`}>
                        <Icon name={p.icon} size={11} />
                      </div>
                      <span className="font-medium text-ink">{p.label}</span>
                    </div>
                    <span className="tabular-nums text-ink-soft">{formatUSD(p.spend)} <span className="text-ink-faint">/ {formatUSD(p.cap)} cap</span></span>
                  </div>
                  <div className="h-5 bg-surface rounded overflow-hidden flex">
                    <div className={`h-full bg-${p.accent}-500 transition-all`}
                      style={{ width: `${(p.spend / maxSpend) * 100}%` }} />
                  </div>
                </div>
              ))}
            </div>
          )}
        </Card>

        {/* CTR by platform */}
        <Card>
          <SectionHeader title="CTR by platform" subtitle="Higher CTR = ad copy + targeting is working." />
          {!anyData ? (
            <div className="border-2 border-dashed border-amber-200 rounded-xl px-4 py-8 text-center bg-amber-50/30">

                      <span className="font-medium text-ink">{p.label}</span>

                      <td className="py-2.5 px-2 text-right tabular-nums text-ink-soft">{p.impressions.toLocaleString()}</td>
                      <td className="py-2.5 px-2 text-right tabular-nums">
