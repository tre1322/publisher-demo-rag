  /* ============================================================
     VIEW: REVIEWS
     ============================================================ */
  const ReviewsView = ({ scrollToId, onScrollHandled }) => {
    const { business, stats, attention, weekRecap, posts, approvals, performance, reviews, marketingPlan, chat, settings } = useDashboard();
    const mutate = useDashboardMutate();
    const [editing, setEditing] = useState(null);    // {review, text}
    const [inFlight, setInFlight] = useState({});    // { [internalId]: true }
    const [skipped, setSkipped] = useState({});      // local-only "Skip" hide
    const [error, setError] = useState(null);
    const [toast, setToast] = useState(null);
    const [highlightId, setHighlightId] = useState(null);

    useEffect(() => {
      if (!toast) return;
      const t = setTimeout(() => setToast(null), 3500);
      return () => clearTimeout(t);
    }, [toast]);

    // Phase B.7: scroll-to-item on entry from Home attention CTA. Fade timer
    // in a separate effect so onScrollHandled() clearing scrollToId doesn't
    // cancel the fade via this effect's cleanup.
    useEffect(() => {
      if (!scrollToId) return;
      const el = document.querySelector(`[data-scroll-id="${scrollToId}"]`);
      if (el) {
        el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        setHighlightId(scrollToId);
      }
      onScrollHandled?.();
    }, [scrollToId]);

    useEffect(() => {
      if (!highlightId) return;
      const t = setTimeout(() => setHighlightId(null), 1600);
      return () => clearTimeout(t);
    }, [highlightId]);

    const respond = async (review, response, action) => {
      if (!review.internalId) {
        setError("Backend is offline — response won't persist.");
        return false;
      }
      if (inFlight[review.internalId]) return false;
      setInFlight(f => ({ ...f, [review.internalId]: true }));
      setError(null);
      try {
        const resp = await fetch(`/api/reviews/${review.internalId}/respond`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ response, action }),
        });
        if (!resp.ok) {
          const detail = await resp.json().catch(() => ({ detail: `HTTP ${resp.status}` }));
          throw new Error(detail.detail || `HTTP ${resp.status}`);
        }
        const json = await resp.json();
        // Update context: replace this review wherever it lives.
        mutate(prev => {
          if (!prev?.reviews) return prev;
          const apply = (r) => r.id === json.review.id
            ? { ...r, response: json.review.response, responseStatus: json.review.responseStatus }
            : r;
          return {
            ...prev,
            reviews: {
              ...prev.reviews,
              recent: (prev.reviews.recent || []).map(apply),
              pinned: prev.reviews.pinned && prev.reviews.pinned.id === json.review.id
                ? { ...prev.reviews.pinned, response: json.review.response, responseStatus: json.review.responseStatus }
                : prev.reviews.pinned,
            },
          };
        });
        if (action === 'send') setToast(`Response sent to ${review.author}.`);
        return true;
      } catch (e) {
        console.error('[reviews.respond] failed', e);
        setError(`Couldn't ${action === 'send' ? 'send' : 'save'} response — ${e.message || e}.`);
        return false;
      } finally {
        setInFlight(f => { const { [review.internalId]: _, ...rest } = f; return rest; });
      }
    };

    return (
      <div className="fade-in">
        <TopBar
          breadcrumb="Reputation"
          title="Reviews"
          subtitle="Google and Facebook reviews with AI-drafted owner responses."
          right={
            <div className="flex items-center gap-3">
              <Stars n={5} size={16} />
              <span className="font-semibold text-ink">{reviews.aggregate}</span>
              <span className="text-xs text-ink-faint">{reviews.total} reviews</span>
            </div>
          }
        />
        {error && (
          <div className="mx-8 mt-5 px-4 py-3 rounded-lg bg-red-50 border border-red-200 text-sm text-bad flex items-start gap-2">
            <Icon name="alert" size={16} className="mt-0.5 shrink-0" />
            <div className="flex-1">{error}</div>
            <button className="text-bad/60 hover:text-bad" onClick={() => setError(null)}>
              <Icon name="x" size={14} />
            </button>
          </div>
        )}
        {toast && (
          <div className="mx-8 mt-5 px-4 py-3 rounded-lg bg-emerald-50 border border-emerald-200 text-sm text-emerald-800 flex items-start gap-2">
            <Icon name="check" size={16} className="mt-0.5 shrink-0" />
            <div className="flex-1">{toast}</div>
            <button className="text-emerald-700/60 hover:text-emerald-800" onClick={() => setToast(null)}>
              <Icon name="x" size={14} />
            </button>
          </div>
        )}
        <div className="px-8 py-7 grid grid-cols-1 lg:grid-cols-3 gap-5">
          {/* Aggregate + sparkline */}
          <Card>
            <SectionHeader title="Rating trend" subtitle="Last six months" />
            <div className="flex items-end gap-4">
              <div>
                <div className="text-4xl font-serif font-semibold">{reviews.aggregate}</div>
                <div className="text-xs text-ink-faint">{reviews.total} total reviews</div>
              </div>
              <div className="flex-1">
                <Sparkline values={reviews.sparkline} width={180} height={36} />
                <div className="flex justify-between text-[10px] text-ink-faint mt-1 px-1">
                  {reviews.sparklineLabels.map(l => <span key={l}>{l}</span>)}
                </div>
              </div>
            </div>
            <div className="mt-5 pt-4 border-t border-surface-edge space-y-2">
              <div className="flex items-center justify-between text-sm"><span className="text-ink-soft">Google</span><span className="font-medium">4.8 ★ · 137</span></div>
              <div className="flex items-center justify-between text-sm"><span className="text-ink-soft">Facebook</span><span className="font-medium">4.9 ★ · 25</span></div>
            </div>
          </Card>

          {/* Pinned negative + recent list */}
          <div className="lg:col-span-2 space-y-5">
            <Card padded={false}
              data-scroll-id={reviews.pinned?.id}
              className={`border-l-4 border-bad transition-all ${highlightId === reviews.pinned?.id ? 'ring-2 ring-brand-500 ring-offset-2' : ''}`}>
              <div className="p-5 border-b border-red-100 bg-red-50/40 flex items-center justify-between">
                <div className="flex items-center gap-2">
                  <Icon name="alert" size={16} className="text-bad" />
                  <span className="font-semibold text-bad">Flagged for fast response</span>
                </div>
                <Pill color="red">2★ · {reviews.pinned.when}</Pill>
              </div>
              <div className="p-5 space-y-4">
                <div className="flex items-start justify-between gap-3">
                  <div>
                    <div className="font-semibold text-ink">{reviews.pinned.author}</div>
                    <div className="text-xs text-ink-faint flex items-center gap-2 mt-0.5">
                      <PlatformChip platform={reviews.pinned.platform} />
                      <Stars n={reviews.pinned.stars} />
                    </div>
                  </div>
                </div>
                <p className="text-sm italic text-ink leading-relaxed border-l-2 border-bad pl-3">"{reviews.pinned.body}"</p>
                <div>
                  <div className="text-xs uppercase tracking-wider text-ink-faint font-medium mb-1.5 inline-flex items-center gap-1.5">
                    <Icon name="sparkles" size={12} className="text-brand-500" /> Drafted response — your voice
                  </div>
                  <p className="text-sm text-ink leading-relaxed bg-surface rounded-lg p-3 border border-surface-edge">{reviews.pinned.response}</p>
                </div>
                <p className="text-xs text-ink-soft italic flex items-start gap-2"><Icon name="sparkles" size={12} className="text-brand-500 mt-0.5 shrink-0" /> {reviews.pinned.note}</p>
                {reviews.pinned.responseStatus === 'approved' ? (
                  <div className="flex items-center gap-2 text-sm text-ok pt-1">
                    <Icon name="check" size={14} strokeWidth={2.4} />
                    <span>Response sent — posted publicly.</span>
                    <Button icon="edit" variant="ghost" size="sm" className="ml-auto"
                      onClick={() => setEditing({ review: reviews.pinned, text: reviews.pinned.response || '' })}>
                      Edit again
                    </Button>
                  </div>
                ) : (
                  <div className="flex items-center gap-2">
                    <Button icon="check" variant="ok" className="flex-1"
                      disabled={!!inFlight[reviews.pinned.internalId]}
                      onClick={() => respond(reviews.pinned, reviews.pinned.response || '', 'send')}>
                      {inFlight[reviews.pinned.internalId] ? 'Sending…' : 'Approve & post'}
                    </Button>
                    <Button icon="edit" variant="secondary"
                      onClick={() => setEditing({ review: reviews.pinned, text: reviews.pinned.response || '' })}>
                      Edit
                    </Button>
                    <a href={`tel:${(business.phone || '').replace(/[^\d+]/g, '')}`}>
                      <Button icon="phone" variant="ghost">Call {reviews.pinned.author.split(' ')[0]}</Button>
                    </a>
                  </div>
                )}
              </div>
            </Card>

            <Card padded={false}>
              <div className="p-5 border-b border-surface-edge flex items-center justify-between">
                <h3 className="font-semibold">Recent reviews</h3>
                <Pill color="slate">{reviews.recent.length} this week</Pill>
              </div>
              <div className="divide-y divide-surface-edge">
                {reviews.recent.map(r => (
                  <div key={r.id} data-scroll-id={r.id}
                    className={`p-5 transition-all ${r.flagged ? 'bg-red-50/30' : ''} ${highlightId === r.id ? 'ring-2 ring-brand-500 ring-inset' : ''}`}>
                    <div className="flex items-start justify-between gap-3">
                      <div className="flex items-center gap-3">
                        <div className="w-9 h-9 rounded-full bg-brand-100 text-brand-700 flex items-center justify-center text-xs font-semibold">
                          {r.author.split(' ').map(s => s[0]).join('').slice(0, 2)}
                        </div>
                        <div>
                          <div className="font-medium text-ink">{r.author}</div>
                          <div className="text-xs text-ink-faint flex items-center gap-2 mt-0.5">
                            <PlatformChip platform={r.platform} withLabel={false} />
                            <Stars n={r.stars} size={12} />
                            <span>·</span><span>{r.when}</span>
                          </div>
                        </div>
                      </div>
                      {r.flagged && <Pill color="red" icon="alert">Flagged</Pill>}
                    </div>
                    <p className="text-sm text-ink-soft mt-3 italic">"{r.body}"</p>
                    {!r.flagged && !skipped[r.id] && (
                      <div className="mt-3 ml-12 bg-surface rounded-lg p-3 border-l-2 border-brand-500 border border-surface-edge">
                        <div className="text-[11px] uppercase tracking-wider text-brand-600 font-semibold mb-1 inline-flex items-center gap-1.5">
                          <Icon name="sparkles" size={11} /> {r.responseStatus === 'approved' ? 'Sent response' : 'Drafted response'}
                        </div>
                        <p className="text-sm text-ink">{r.response}</p>
                        {r.responseStatus === 'approved' ? (
                          <div className="flex items-center gap-2 mt-3 text-xs text-ok">
                            <Icon name="check" size={12} strokeWidth={2.4} />
                            <span>Sent</span>
                            <Button icon="edit" variant="ghost" size="sm" className="ml-auto"
                              onClick={() => setEditing({ review: r, text: r.response || '' })}>
                              Edit again
                            </Button>
                          </div>
                        ) : (
                          <div className="flex items-center gap-2 mt-3">
                            <Button icon="check" variant="ok" size="sm"
                              disabled={!!inFlight[r.internalId]}
                              onClick={() => respond(r, r.response || '', 'send')}>
                              {inFlight[r.internalId] ? 'Sending…' : 'Approve'}
                            </Button>
                            <Button icon="edit" variant="secondary" size="sm"
                              onClick={() => setEditing({ review: r, text: r.response || '' })}>
                              Edit
                            </Button>
                            <Button icon="x" variant="ghost" size="sm"
                              onClick={() => setSkipped(s => ({ ...s, [r.id]: true }))}>
                              Skip
                            </Button>
                          </div>
                        )}
                      </div>
                    )}
                  </div>
                ))}
              </div>
            </Card>
          </div>
        </div>

        {/* Edit-response modal — reused for pinned + recent reviews.
            Two-action footer: Save draft (status='draft') keeps owner iterating;
            Send (status='approved') locks it in and clocks response_sent_at. */}
        <Modal
          open={!!editing}
          onClose={editing && inFlight[editing.review.internalId] ? () => {} : () => setEditing(null)}
          title={editing ? `Reply to ${editing.review.author}` : ''}
          footer={editing && <>
            <Button variant="ghost" onClick={() => setEditing(null)}
              disabled={!!inFlight[editing.review.internalId]}>Cancel</Button>
            <Button variant="secondary" icon="bookmark"
              disabled={!editing.text.trim() || !!inFlight[editing.review.internalId]}
              onClick={async () => {
                const ok = await respond(editing.review, editing.text, 'save');
                if (ok) setEditing(null);
              }}>
              Save draft
            </Button>
            <Button variant="primary" icon="send"
              disabled={!editing.text.trim() || !!inFlight[editing.review.internalId]}
              onClick={async () => {
                const ok = await respond(editing.review, editing.text, 'send');
                if (ok) setEditing(null);
              }}>
              {inFlight[editing.review.internalId] ? 'Sending…' : 'Send response'}
            </Button>
          </>}>
          {editing && (
            <div className="space-y-3">
              <div className="bg-surface border border-surface-edge rounded-lg p-3 text-sm">
                <div className="text-xs uppercase tracking-wider font-medium text-ink-faint mb-1.5">
                  {editing.review.author} · {editing.review.stars}★ · {editing.review.when}
                </div>
                <p className="text-ink italic">"{editing.review.body}"</p>
              </div>
              <div>
                <label className="text-xs uppercase tracking-wider font-medium text-ink-faint mb-1.5 block">Your reply</label>
                <textarea
                  className="w-full px-3 py-2 rounded-lg border border-surface-edge text-[15px] leading-relaxed focus:outline-none focus:border-brand-500"
                  rows="7"
                  value={editing.text}
                  onChange={(e) => setEditing(ed => ed ? { ...ed, text: e.target.value } : ed)}
                />
              </div>
              <p className="text-xs text-ink-faint">
                <span className="font-medium">Save draft</span> keeps your edits private. <span className="font-medium">Send</span> posts publicly on {(editing.review.platform || '').toUpperCase()}.
              </p>
            </div>
          )}
        </Modal>
      </div>
    );
  };

  /* ============================================================
     VIEW: MARKETING PLAN
     ============================================================ */
  const MarketingPlanView = ({ pendingTrain, onClearTrain }) => {
    const { business, stats, attention, weekRecap, posts, approvals, performance, reviews, marketingPlan, chat, settings, voiceBrief } = useDashboard();
    const mutate = useDashboardMutate();
    const [tab, setTab] = useState('strategy');
    const [editing, setEditing] = useState(null);  // field key currently open for edit
    const [savingPlan, setSavingPlan] = useState(false);
    const [planError, setPlanError] = useState(null);

  // Suggestion chips derive from the business's voice brief so they always
  // speak THIS business's language. Hardcoded chips rot: the original set
  // ("farm-tire field service") outlived the tire-shop seed it was written
  // for and surfaced in front of a B2B SaaS customer.
  const GENERIC_SUGGESTIONS = [
    "What should I post this week?",
    "Draft my next post",
    "Which approval should I look at first?",
    "How is my marketing plan looking?",
  ];
  const deriveSuggestions = (vb) => {
    if (!vb) return GENERIC_SUGGESTIONS;
    const chips = [];
    const amplify = vb.amplify || [];
    const phrases = vb.customer_language || [];
    if (amplify.length >= 1 && amplify[0].label) chips.push(`Draft a post about "${amplify[0].label}"`);
    if (amplify.length >= 2 && amplify[1].label) chips.push(`What's a good angle on "${amplify[1].label}"?`);
    // Keep quoted customer phrases chip-sized — long ones wrap into paragraphs.
    if (phrases.length >= 1 && phrases[0] && phrases[0].length <= 60) {
      chips.push(`Write a post that uses the phrase "${phrases[0]}"`);
    }
    for (const g of GENERIC_SUGGESTIONS) {
      if (chips.length >= 4) break;
      chips.push(g);
    }
    return chips.slice(0, 4);
  };

  const ChatView = ({ onNavigate }) => {
    const { business, stats, attention, weekRecap, posts, approvals, performance, reviews, marketingPlan, chat, settings, voiceBrief } = useDashboard();
    const mutate = useDashboardMutate();
    const [input, setInput] = useState('');
    const [sending, setSending] = useState(false);
    const [chatError, setChatError] = useState(null);
    const conversationRef = useRef(null);

    // Auto-scroll to bottom when chat grows OR when the streaming agent
    // turn's text grows. Watching the last agent text length keeps the
    // viewport pinned to the bottom as deltas stream in.
    const lastAgentLen = (() => {
      const last = chat[chat.length - 1];
      return last && last.who === 'agent' ? (last.text || '').length + (last.attachment?.items?.length || 0) * 100 : 0;
    })();
    useEffect(() => {
      const el = conversationRef.current;
      if (el) el.scrollTop = el.scrollHeight;
    }, [chat.length, sending, lastAgentLen]);

    // Mutate the LAST agent turn in the chat array. Used for streaming
    // updates: append text deltas, set/clear an inflight-tool indicator,
    // push tool result attachments onto attachment.items[].
    const updateLastAgentTurn = (updater) => {
      mutate(prev => {
        if (!prev) return prev;
        const chat = (prev.chat || []).slice();
        const last = chat[chat.length - 1];
        if (last && last.who === 'agent') {
          chat[chat.length - 1] = updater(last);
        }
        return { ...prev, chat };
      });
    };

    const send = async (text) => {
      const trimmed = (text ?? input).trim();
      if (!trimmed || sending) return;
      setSending(true);
      setChatError(null);
      const whenNow = (() => {
        const d = new Date();
        const h12 = d.getHours() % 12 || 12;
        const ampm = d.getHours() < 12 ? 'am' : 'pm';
        return `Today, ${h12}:${String(d.getMinutes()).padStart(2, '0')}${ampm}`;
      })();
      // Optimistic: drop the owner turn + an empty streaming agent turn into
      // the conversation immediately. The agent turn will mutate as the SSE
      // stream arrives. `_streaming: true` lets the renderer show a
      // typewriter-style cursor / thinking indicator.
      const optimisticOwner = { who: 'owner', when: whenNow, text: trimmed };
      const optimisticAgent = {
        who: 'agent', when: whenNow, text: '',
        attachment: { items: [] },
        _streaming: true,
        _inflightTool: null,
      };
      mutate(prev => prev ? ({ ...prev, chat: [...(prev.chat || []), optimisticOwner, optimisticAgent] }) : prev);
      setInput('');
      try {
        const resp = await fetch('/api/chat/turn', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Accept': 'text/event-stream' },
          body: JSON.stringify({ message: trimmed }),
        });
        if (!resp.ok) {
          // Validation/auth errors come back as JSON, not SSE.
          const j = await resp.json().catch(() => ({ detail: `HTTP ${resp.status}` }));
          const msg = Array.isArray(j.detail) ? (j.detail[0]?.msg || `HTTP ${resp.status}`) : (j.detail || `HTTP ${resp.status}`);
          throw new Error(msg);
        }
        if (!resp.body) throw new Error('Empty response body — streaming unsupported?');

        const reader = resp.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';
        let finished = false;
        let canonical = null;  // populated by the `done` event

        while (!finished) {
          const { value, done: streamDone } = await reader.read();
          if (streamDone) break;
          buffer += decoder.decode(value, { stream: true });

          // SSE events are separated by a blank line (\n\n). Parse each
          // complete event out of the buffer; leave any partial event behind.
          let sep;
          while ((sep = buffer.indexOf('\n\n')) >= 0) {
            const block = buffer.slice(0, sep);
            buffer = buffer.slice(sep + 2);
            let eventName = 'message';
            let dataStr = '';
            for (const line of block.split('\n')) {
              if (line.startsWith('event: ')) eventName = line.slice(7).trim();
              else if (line.startsWith('data: ')) dataStr += line.slice(6);
            }
            if (!dataStr) continue;
            let data;
            try { data = JSON.parse(dataStr); } catch { continue; }

            if (eventName === 'delta') {
              updateLastAgentTurn(a => ({ ...a, text: (a.text || '') + (data.text || '') }));
            } else if (eventName === 'tool_start') {
              updateLastAgentTurn(a => ({ ...a, _inflightTool: data.name }));
            } else if (eventName === 'tool_result') {
              updateLastAgentTurn(a => {
                const items = (a.attachment?.items || []).slice();
                items.push(data.attachment);
                return { ...a, _inflightTool: null, attachment: { items } };
              });
            } else if (eventName === 'done') {
              canonical = data;
              finished = true;
            } else if (eventName === 'error') {
              throw new Error(data.detail || 'stream error');
            }
          }
        }

        // Reconcile the streamed turns with the canonical pair from the server.
        // The text + attachments should already match what we built up via
        // deltas; this swap normalizes timestamps and clears the _streaming flag.
        if (canonical && canonical.ownerTurn && canonical.agentTurn) {
          mutate(prev => {
            if (!prev) return prev;
            const without = (prev.chat || []).slice(0, -2);
            return { ...prev, chat: [...without, canonical.ownerTurn, canonical.agentTurn] };
          });
        } else {
          // Stream ended without `done` — fall back to clearing the streaming flag.
          updateLastAgentTurn(a => ({ ...a, _streaming: false, _inflightTool: null }));
        }
      } catch (e) {
        // Roll back the optimistic owner + agent pair so the user can retry.
        mutate(prev => {
          if (!prev) return prev;
          return { ...prev, chat: (prev.chat || []).slice(0, -2) };
        });
        setInput(trimmed);
        setChatError(e.message || 'Send failed');
      } finally {
        setSending(false);
      }
    };

    const onKeyDown = (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        send();
      }
    };

    const suggestions = deriveSuggestions(voiceBrief);

    return (
      <div className="fade-in flex flex-col" style={{ minHeight: 'calc(100vh - 0px)' }}>
        <TopBar
          breadcrumb="Workspace"
          title="AI Agent"
          subtitle="Talk to your agent. Ask for advice, drafts, or what to do next."
          right={
            <div className="flex items-center gap-2">
              <Pill color="emerald" icon="check">Online</Pill>
              {voiceBrief && <Pill color="violet" icon="sparkles">Writing in your voice</Pill>}
            </div>
          }
        />
        <div className="px-8 py-7 grid grid-cols-1 lg:grid-cols-[1fr_320px] gap-5 flex-1">
          {/* Conversation */}
          <Card padded={false} className="flex flex-col">
            <div ref={conversationRef} className="p-6 space-y-6 flex-1 overflow-y-auto" style={{ maxHeight: 'calc(100vh - 260px)' }}>
              {chat.map((m, i) => {
                const isOwner = m.who === 'owner';
                return (
                  <div key={i} className={`flex gap-3 ${isOwner ? 'flex-row-reverse' : ''}`}>
                    <div className={`shrink-0 w-9 h-9 rounded-full flex items-center justify-center text-xs font-semibold ${isOwner ? 'bg-brand-500 text-white' : 'bg-accent text-brand-800'}`}>
                      {isOwner ? (business?.ownerInitials || '—') : <Icon name="sparkles" size={16} strokeWidth={2.2} />}
                    </div>
                    <div className={`max-w-[68%] ${isOwner ? 'items-end' : 'items-start'} flex flex-col`}>
                      <div className={`rounded-2xl px-4 py-3 text-sm leading-relaxed ${isOwner ? 'bg-brand-500 text-white rounded-tr-md' : 'bg-surface border border-surface-edge text-ink rounded-tl-md'}`}>
                        {/* Streaming agent turn with no text yet → show Thinking pill */}
                        {m._streaming && !m.text && !(m.attachment?.items?.length) && !m._inflightTool && (
                          <span className="text-ink-soft italic">Thinking<span className="animate-pulse">…</span></span>
                        )}
                        <FormattedText text={m.text} />
                        {/* Typewriter cursor while streaming */}
                        {m._streaming && m.text && !m._inflightTool && (
                          <span className="inline-block w-[2px] h-[1em] ml-0.5 bg-brand-500 align-middle animate-pulse" />
                        )}
                        {/* Inflight tool indicator — mid-conversation tool fire */}
                        {m._inflightTool && (
                          <div className="mt-2 text-xs text-brand-700 bg-brand-50 border border-brand-100 rounded-lg px-2.5 py-1.5 inline-flex items-center gap-1.5">
                            <Icon name="sparkles" size={12} className="animate-pulse" />
                            {m._inflightTool === 'draft_post' && 'Drafting post…'}
                            {m._inflightTool === 'propose_boost' && 'Calculating boost…'}
                            {m._inflightTool === 'draft_review_response' && 'Drafting response…'}
                            {m._inflightTool === 'regenerate_insights' && 'Refreshing insights…'}
                          </div>
                        )}
                        {/* Legacy seeded turn: singular attachment with kind. */}
                        {m.attachment && m.attachment.kind === 'boost-card' && (
                          <BoostCard attachment={m.attachment} />
                        )}
                        {/* C.3 multi-step tool turn: attachment.items[] with mixed kinds. */}
                        {m.attachment && Array.isArray(m.attachment.items) && m.attachment.items.length > 0 && (
                          <div className="space-y-2 mt-3">
                            {m.attachment.items.map((it, j) => <ToolCard key={j} attachment={it} onNavigate={onNavigate} />)}
                          </div>
                        )}
                      </div>
                      <div className="text-[11px] text-ink-faint mt-1">{m.when}</div>
                    </div>
                  </div>
                );
              })}
            </div>
            {chatError && (
              <div className="mx-4 mb-2 px-3 py-2 rounded-lg bg-rose-50 border border-rose-200 text-rose-800 text-xs flex items-start gap-2">
                <Icon name="alert" size={13} className="mt-0.5 shrink-0" />
                <span><strong>Send failed:</strong> {chatError}</span>
                <button onClick={() => setChatError(null)} className="ml-auto text-rose-600 hover:underline">Dismiss</button>
              </div>
            )}
            <div className="border-t border-surface-edge p-4 bg-surface">
              <div className="flex items-center gap-2 bg-white border border-surface-edge rounded-xl px-3 py-2">
                <input
                  type="text"
                  placeholder="Ask the agent anything…"
                  value={input}
                  onChange={(e) => setInput(e.target.value)}
                  onKeyDown={onKeyDown}
                  disabled={sending}
                  className="flex-1 bg-transparent text-sm outline-none placeholder:text-ink-faint disabled:opacity-60"
                />
                <button
                  onClick={() => send()}
                  disabled={sending || !input.trim()}
                  className="p-1.5 rounded-lg bg-brand-500 text-white disabled:opacity-50 hover:bg-brand-600 transition-all"
                >
                  <Icon name="chevR" size={16} />
                </button>
              </div>
              <div className="text-[11px] text-ink-faint mt-2 flex items-center gap-1.5">
                <Icon name="sparkles" size={11} className="text-brand-500" /> Drafts and answers come from your voice brief — the agent writes in your voice.
                <a className="text-brand-600 font-medium hover:underline cursor-pointer ml-1">Talk to your rep →</a>
              </div>
            </div>
          </Card>

          {/* Side rail: context */}
          <div className="space-y-4">
            <Card>
              <SectionHeader title="What the agent knows" subtitle={voiceBrief ? "Live from your voice brief" : "Pre-interview"} />
              {voiceBrief ? (
                <div className="space-y-3 text-sm">
                  {voiceBrief.voice && (
                    <div className="text-ink-soft leading-relaxed italic">
                      "{voiceBrief.voice}"
                    </div>
                  )}
                  <ul className="space-y-2 text-ink-soft pt-2 border-t border-surface-edge">
                    <li className="flex items-start gap-2">
                      <Icon name="check" size={13} className="text-ok mt-0.5 shrink-0" />
                      <span><strong className="text-ink">{(voiceBrief.amplify || []).length}</strong> things to play up <span className="text-ink-faint">(AMPLIFY)</span></span>
                    </li>
                    <li className="flex items-start gap-2">
                      <Icon name="check" size={13} className="text-ok mt-0.5 shrink-0" />
                      <span><strong className="text-ink">{(voiceBrief.maintain || []).length}</strong> at status quo <span className="text-ink-faint">(MAINTAIN)</span></span>
                    </li>
                    <li className="flex items-start gap-2">
                      <Icon name="check" size={13} className="text-ok mt-0.5 shrink-0" />
                      <span><strong className="text-ink">{(voiceBrief.mute || []).length}</strong> things to play down <span className="text-ink-faint">(MUTE)</span></span>
                    </li>
                    <li className="flex items-start gap-2">
                      <Icon name="check" size={13} className="text-ok mt-0.5 shrink-0" />
                      <span><strong className="text-ink">{(voiceBrief.customer_language || []).length}</strong> customer phrases captured</span>
                    </li>
                    <li className="flex items-start gap-2">
                      <Icon name="check" size={13} className="text-ok mt-0.5 shrink-0" />
                      <span><strong className="text-ink">{(voiceBrief.proof_points || []).length}</strong> proof points ready</span>
                    </li>
                  </ul>
                  {(voiceBrief.amplify || []).length > 0 && (
                    <div className="pt-3 border-t border-surface-edge">
                      <div className="text-[11px] uppercase tracking-wider font-semibold text-ink-faint mb-1.5">Top AMPLIFY</div>
                      <div className="text-xs text-ink-soft leading-relaxed">
                        <strong className="text-ink">{voiceBrief.amplify[0].label}:</strong> {voiceBrief.amplify[0].detail}
                      </div>
                    </div>
                  )}
                </div>
              ) : (
                <ul className="text-sm space-y-2 text-ink-soft">
                  <li className="flex items-start gap-2"><Icon name="alert" size={13} className="text-ink-faint mt-0.5 shrink-0" />No voice brief yet — complete your interview to capture your voice.</li>
                </ul>
              )}
            </Card>
            <Card>
              <SectionHeader title="Suggestions" subtitle="What you might ask next" />
              <div className="space-y-2">
                {suggestions.map((s, i) => (
                  <button
                    key={i}
                    onClick={() => send(s)}
                    disabled={sending}
                    className="text-left w-full text-sm text-ink-soft bg-surface hover:bg-brand-50 hover:text-brand-700 transition-all rounded-lg p-2.5 border border-surface-edge disabled:opacity-50"
                  >
                    "{s}"
                  </button>
                ))}
              </div>
            </Card>
          </div>
        </div>
      </div>
    );
  };

  // Renders simple **bold** in an agent message.
  const FormattedText = ({ text }) => {
    const parts = text.split(/(\*\*[^*]+\*\*)/g).filter(Boolean);
    return <span>{parts.map((p, i) =>
      p.startsWith('**') ? <strong key={i}>{p.slice(2, -2)}</strong> : <Fragment key={i}>{p}</Fragment>
    )}</span>;
  };

  const BoostCard = ({ attachment }) => (
    <div className="mt-3 bg-white text-ink rounded-lg border border-surface-edge p-3">
      <div className="text-[11px] uppercase tracking-wider font-semibold text-brand-600 mb-2 flex items-center gap-1.5">
        <Icon name="sparkles" size={11} /> Proposed boost
      </div>
      <dl className="grid grid-cols-2 gap-x-3 gap-y-1.5 text-xs">
        <dt className="text-ink-faint">Budget</dt><dd className="font-medium">{attachment.budget}</dd>
        <dt className="text-ink-faint">Audience age</dt><dd className="font-medium">{attachment.ages}</dd>
        <dt className="text-ink-faint">Radius</dt><dd className="font-medium">{attachment.radius}</dd>
        <dt className="text-ink-faint">Estimated reach</dt><dd className="font-medium">{attachment.reach}</dd>
        <dt className="text-ink-faint">Estimated clicks</dt><dd className="font-medium">{attachment.clicks}</dd>
        <dt className="text-ink-faint">Posts</dt><dd className="font-medium">{attachment.post}</dd>
      </dl>
    </div>
  );

  // C.3 — dispatcher for inline tool-use cards in chat. Each card mirrors the
  // {kind: ...} attachment payloads emitted by app/agent/tools.py.
  const ToolCard = ({ attachment, onNavigate }) => {
    if (!attachment) return null;
    switch (attachment.kind) {
      case 'boost-card':
        return <BoostCard attachment={attachment} />;
      case 'draft-post-card':
        return <DraftPostCard attachment={attachment} onNavigate={onNavigate} />;
      case 'review-response-card':
        return <ReviewResponseCard attachment={attachment} onNavigate={onNavigate} />;
      case 'insights-refreshed':
        return <InsightsRefreshedCard attachment={attachment} onNavigate={onNavigate} />;
      case 'allocate-budget-card':
        return <AllocateBudgetCard attachment={attachment} onNavigate={onNavigate} />;
      case 'schedule-boost-card':
        return <ScheduleBoostCard attachment={attachment} onNavigate={onNavigate} />;
      case 'pause-campaign-card':
        return <PauseCampaignCard attachment={attachment} onNavigate={onNavigate} />;
      case 'tool-error':
        return <ToolErrorCard attachment={attachment} />;
      default:
        return (
          <div className="bg-white text-ink rounded-lg border border-surface-edge p-3 text-[11px] text-ink-faint">
            Unknown tool card: <code>{attachment.kind}</code>
          </div>
        );
    }
  };

  // Phase E.4 — tier-gated card variants. tierMode='autonomous' (Tier 3,
  // green badge) vs 'proposal' (Tier 2, amber badge). Pattern mirrors
  // existing BoostCard/DraftPostCard.

  const TierBadge = ({ mode }) => mode === 'autonomous'
    ? <Pill color="emerald" icon="check">Auto-scheduled</Pill>
    : <Pill color="amber">Awaiting your approval</Pill>;

  const AllocateBudgetCard = ({ attachment, onNavigate }) => (
    <div className="bg-white text-ink rounded-lg border border-amber-200 p-3">
      <div className="text-[11px] uppercase tracking-wider font-semibold text-amber-700 mb-2 flex items-center gap-1.5">
        <Icon name="dollar" size={11} /> Budget allocation
      </div>
      <div className="text-sm font-semibold text-ink mb-1">
        {attachment.monthlyDollars}/month on {attachment.platform}
      </div>
      <div className="text-[11px] text-ink-soft italic mb-2">{attachment.reasoning}</div>
      <div className="flex items-center justify-between pt-2 border-t border-surface-edge">
        <TierBadge mode={attachment.tierMode} />
        <button onClick={() => onNavigate?.('ads')}
          className="text-[11px] text-brand-600 hover:underline font-medium">Open Ads & Spend →</button>
      </div>
    </div>
  );

  const ScheduleBoostCard = ({ attachment, onNavigate }) => (
    <div className="bg-white text-ink rounded-lg border border-amber-200 p-3">
      <div className="text-[11px] uppercase tracking-wider font-semibold text-amber-700 mb-2 flex items-center gap-1.5">
        <Icon name="send" size={11} /> Paid boost · {attachment.platform}
      </div>
      <div className="text-sm font-semibold text-ink mb-1 truncate">{attachment.postTitle}</div>
      <dl className="text-[11px] text-ink-soft grid grid-cols-2 gap-x-3 gap-y-1 mb-2">
        <dt className="text-ink-faint">Daily</dt><dd className="font-medium">{attachment.dailyDollars}</dd>
        <dt className="text-ink-faint">Total</dt><dd className="font-medium">{attachment.totalDollars} ({attachment.days} days)</dd>
        <dt className="text-ink-faint col-span-2">Audience: <span className="text-ink-soft normal-case font-normal italic">{attachment.audience}</span></dt>
      </dl>
      <div className="flex items-center justify-between pt-2 border-t border-surface-edge">
        <TierBadge mode={attachment.tierMode} />
        <button onClick={() => onNavigate?.(attachment.tierMode === 'proposal' ? 'approvals' : 'ads')}
          className="text-[11px] text-brand-600 hover:underline font-medium">
          {attachment.tierMode === 'proposal' ? 'Open Approvals →' : 'Open Ads & Spend →'}
        </button>
      </div>
    </div>
  );

  const PauseCampaignCard = ({ attachment, onNavigate }) => (
    <div className="bg-white text-ink rounded-lg border border-slate-300 p-3">
      <div className="text-[11px] uppercase tracking-wider font-semibold text-slate-600 mb-2 flex items-center gap-1.5">
        <Icon name="x" size={11} /> Pause campaign
      </div>
      <div className="text-sm font-semibold text-ink mb-1">{attachment.campaignName}</div>
      <div className="text-[11px] text-ink-soft italic mb-2">{attachment.reason}</div>
      <div className="flex items-center justify-between pt-2 border-t border-surface-edge">
        <TierBadge mode={attachment.tierMode} />
        <button onClick={() => onNavigate?.(attachment.tierMode === 'proposal' ? 'approvals' : 'ads')}
          className="text-[11px] text-brand-600 hover:underline font-medium">
          {attachment.tierMode === 'proposal' ? 'Open Approvals →' : 'Open Ads & Spend →'}
        </button>
      </div>

  const PLATFORM_LABEL = {
    facebook: 'Facebook', instagram: 'Instagram', google: 'Google Business',
    tiktok: 'TikTok', linkedin: 'LinkedIn', x: 'X',
  };

  const DraftPostCard = ({ attachment, onNavigate }) => (
    <div className="bg-white text-ink rounded-lg border border-brand-200 p-3">
      <div className="text-[11px] uppercase tracking-wider font-semibold text-brand-600 mb-2 flex items-center gap-1.5">

      </div>
      <div className="text-sm font-semibold text-ink mb-1.5">{attachment.title}</div>

        <button
          type="button"

          className="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-brand-500 text-white text-sm font-medium hover:bg-brand-600 transition-colors shrink-0"
        >
          Open in Approvals
          <Icon name="chevR" size={14} />

  const ReviewResponseCard = ({ attachment, onNavigate }) => (
    <div className="bg-white text-ink rounded-lg border border-amber-200 p-3">
      <div className="text-[11px] uppercase tracking-wider font-semibold text-amber-700 mb-2 flex items-center gap-1.5">
        <Icon name="sparkles" size={11} /> Drafted review response · {PLATFORM_LABEL[attachment.platform] || attachment.platform}
      </div>
      <div className="text-xs text-ink-soft leading-relaxed mb-2 italic border-l-2 border-amber-300 pl-2">
        <strong>{attachment.author} · {'★'.repeat(attachment.stars || 0)}</strong> — {attachment.original}
      </div>
      <div className="text-xs text-ink leading-relaxed whitespace-pre-wrap mb-2.5">{attachment.draft}</div>
      <div className="pt-3 mt-1 border-t border-surface-edge flex items-center justify-between gap-3">
        <span className="text-[11px] text-ink-faint">Approval #{attachment.approval_id} · awaiting your review</span>
        <button
          type="button"
          onClick={() => onNavigate && onNavigate('reviews', `r${attachment.review_id}`)}
          className="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-amber-500 text-white text-sm font-medium hover:bg-amber-600 transition-colors shrink-0"
        >
          Open Reviews tab
          <Icon name="chevR" size={14} />
        </button>
      </div>
    </div>
  );

  const InsightsRefreshedCard = ({ attachment, onNavigate }) => (
    <div className="bg-white text-ink rounded-lg border border-emerald-200 p-3">
      <div className="text-[11px] uppercase tracking-wider font-semibold text-emerald-700 mb-1 flex items-center gap-1.5">
        <Icon name="trending" size={11} /> Insights refreshed
      </div>
      <div className="flex items-center justify-between gap-3 mt-1">
        <span className="text-xs text-ink-soft">
          Performance tab will reflect the latest rollup on next load.
        </span>
        <button
          type="button"
          onClick={() => onNavigate && onNavigate('performance')}
          className="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-emerald-500 text-white text-sm font-medium hover:bg-emerald-600 transition-colors shrink-0"
        >
          Open Performance
          <Icon name="chevR" size={14} />
        </button>

  const ToolErrorCard = ({ attachment }) => (
    <div className="bg-rose-50 text-rose-800 rounded-lg border border-rose-200 p-3 text-xs">
      <div className="font-semibold mb-0.5">Tool error: {attachment.tool}</div>
      <div className="text-rose-700">{attachment.reason}</div>
    </div>
  );

  /* ============================================================
     VIEW: INVENTORY  (Phase F.1 — Tier 4 inventory feeds)
     ============================================================ */
  // Helper: human-readable money from cents. The inventory listings carry
  // prices in cents; the Billing view does too.
  const fmtMoneyCents = (cents) => {
    if (cents == null) return '—';
    const dollars = cents / 100;
    if (dollars >= 1000) return `$${dollars.toLocaleString('en-US', { maximumFractionDigits: 0 })}`;
    return `$${dollars.toLocaleString('en-US', { maximumFractionDigits: 2 })}`;
  };

  // Sentiment chip colors used by ChatbotPreviewView.
  const SENTIMENT_CHIP = {
    positive: { bg: 'bg-emerald-50', text: 'text-emerald-700', dot: '#16a34a' },
    neutral:  { bg: 'bg-slate-100',  text: 'text-slate-700',   dot: '#64748b' },
    negative: { bg: 'bg-rose-50',    text: 'text-rose-700',    dot: '#e11d48' },
    mixed:    { bg: 'bg-amber-50',   text: 'text-amber-700',   dot: '#d97706' },
  };

  const InventoryView = ({ onNavigate }) => {
    const { business } = useDashboard();
    const [invState, setInvState]   = useState(null);
    const [loading, setLoading]     = useState(true);
    const [error, setError]         = useState(null);
    const [tab, setTab]             = useState('overview');
    const [importing, setImporting] = useState(null);  // feed_type while importing
    const [syncing, setSyncing]     = useState(null);  // feed_id while syncing
    const [search, setSearch]       = useState('');
    const [statusFilter, setStatusFilter] = useState('all');  // all|active|stale|sold|pending
    const [showConnect, setShowConnect] = useState(false);
    const [newFeed, setNewFeed]     = useState({ feed_type: 'vauto', location_label: '' });
    const [creatingFeed, setCreatingFeed] = useState(false);

    const refresh = useCallback(async () => {
      try {
        const r = await fetch('/api/inventory');
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        setInvState(await r.json());
        setError(null);
      } catch (e) {
        console.error('[inventory.refresh]', e);
        setError(`Couldn't load inventory: ${e.message || e}`);
      } finally {
        setLoading(false);
      }
    }, []);
    useEffect(() => { refresh(); }, [refresh]);

    const handleImportFixture = async (feed_type) => {
      setImporting(feed_type);
      try {
        const r = await fetch('/api/inventory/import-fixture', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ feed_type }),
        });
        if (!r.ok) {
          const detail = await r.json().catch(() => ({ detail: `HTTP ${r.status}` }));
          throw new Error(detail.detail || `HTTP ${r.status}`);
        }
        await refresh();
      } catch (e) {
        console.error('[inventory.importFixture]', e);
        setError(`Couldn't import sample: ${e.message || e}`);
      } finally {
        setImporting(null);
      }
    };

    const handleSync = async (feedId) => {
      setSyncing(feedId);
      try {
        const r = await fetch(`/api/inventory/feeds/${feedId}/sync`, { method: 'POST' });
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        await refresh();
      } catch (e) {
        console.error('[inventory.sync]', e);
        setError(`Sync failed: ${e.message || e}`);
      } finally {
        setSyncing(null);
      }
    };

    const handleDisconnect = async (feedId) => {
      if (!window.confirm('Disconnect this feed? Listings stay but will go stale.')) return;
      try {
        const r = await fetch(`/api/inventory/feeds/${feedId}`, { method: 'DELETE' });
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        await refresh();
      } catch (e) {
        console.error('[inventory.disconnect]', e);
        setError(`Couldn't disconnect: ${e.message || e}`);
      }
    };

    const handleCreateFeed = async () => {
      if (!newFeed.location_label.trim()) {
        setError('Location label is required.');
        return;
      }
      setCreatingFeed(true);
      try {
        const r = await fetch('/api/inventory/feeds', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(newFeed),
        });
        if (!r.ok) {
          const detail = await r.json().catch(() => ({ detail: `HTTP ${r.status}` }));
          throw new Error(detail.detail || `HTTP ${r.status}`);
        }
        setShowConnect(false);
        setNewFeed({ feed_type: 'vauto', location_label: '' });
        await refresh();
      } catch (e) {
        console.error('[inventory.connect]', e);
        setError(`Couldn't connect feed: ${e.message || e}`);
      } finally {
        setCreatingFeed(false);
      }
    };

    if (loading) {
      return (
        <div className="px-8 py-7">
          <TopBar breadcrumb="Inventory" title="Inventory" subtitle="Live inventory feeds." />
          <div className="text-ink-soft text-sm mt-6">Loading inventory data…</div>
        </div>
      );
    }
    if (!invState) {
      return (
        <div className="px-8 py-7">
          <TopBar breadcrumb="Inventory" title="Inventory" subtitle="Live inventory feeds." />
          <Card className="mt-6">
            <div className="text-rose-700 text-sm">{error || 'Inventory endpoint returned no data.'}</div>
          </Card>
        </div>
      );
    }

    const filteredListings = (invState.listings || []).filter(li => {
      if (statusFilter === 'all' && !search) return true;
      if (statusFilter === 'stale' && !li.isStale) return false;
      if (statusFilter !== 'all' && statusFilter !== 'stale' && li.status !== statusFilter) return false;
      if (search && !li.title.toLowerCase().includes(search.toLowerCase())) return false;
      return true;
    });

    const tabs = [
      { id: 'overview', label: 'Overview',        icon: 'chart' },
      { id: 'listings', label: 'Listings',        icon: 'box',  count: invState.totals.listings || undefined },
      { id: 'search',   label: 'Search visibility', icon: 'search' },
      { id: 'feeds',    label: 'Feeds',           icon: 'plus', count: invState.feeds?.length || undefined }
    ];

    const t = invState.totals;
    return (
      <div className="fade-in">
        <TopBar
          breadcrumb="Inventory"
          title="Inventory"
          subtitle={invState.tierEligible
            ? "Sync listings from your DMS / MLS / marketplace feeds — see what's working in chatbot search."
            : "The Inventory plan unlocks live sync, faceted-search visibility, and stale-listing alerts."}
          right={
            <div className="flex items-center gap-2">
              <Pill color={invState.tierEligible ? 'emerald' : 'slate'}>
                Tier {invState.tier} — {invState.tierEligible ? 'Inventory included' : 'Upgrade required'}
              </Pill>
              {invState.tierEligible && (
                <button
                  onClick={() => setShowConnect(true)}
                  className="px-3 py-2 rounded-lg bg-brand-700 text-white text-sm font-medium hover:bg-brand-800 inline-flex items-center gap-2">
                  <Icon name="plus" size={14} /> Connect feed
                </button>
              )}
            </div>
          }
        />
        <div className="px-8 pt-2"><TabBar tabs={tabs} value={tab} onChange={setTab} /></div>

        {error && (
          <div className="mx-8 mt-3 px-4 py-2 rounded-lg bg-rose-50 border border-rose-200 text-rose-800 text-sm flex items-center justify-between">
            <span>{error}</span>
            <button className="text-rose-600 hover:text-rose-800" onClick={() => setError(null)}><Icon name="x" size={14} /></button>
          </div>
        )}

        <div className="px-8 py-7 space-y-5">
          {!invState.tierEligible && (
            <Card>
              <div className="flex items-start gap-4">
                <div className="shrink-0 w-12 h-12 rounded-xl bg-amber-100 text-amber-700 flex items-center justify-center">
                  <Icon name="box" size={22} />
                </div>
                <div className="flex-1">
                  <div className="font-serif text-lg font-semibold text-ink">The Inventory plan unlocks this view</div>
                  <p className="text-sm text-ink-soft mt-1">
                    Connect inventory feeds from DealerCenter, vAuto, TractorHouse, MLS, BoatTrader, or generic CSV.
                    Listings sync into your publisher's chatbot so consumer searches surface your stock directly.
                    Tier 4 Base is $799/month with up to 50 listings + one feed integration.
                  </p>
                  <div className="mt-3">
                    <button
                      onClick={() => onNavigate?.('settings')}
                      className="px-3 py-2 rounded-lg bg-brand-700 text-white text-sm hover:bg-brand-800">
                      Upgrade in Settings → Billing
                    </button>
                  </div>
                </div>
              </div>
            </Card>
          )}

          {tab === 'overview' && (
            <div className="space-y-5 fade-in">
              <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                <Card className="bg-gradient-to-br from-brand-700 to-brand-900 text-white">
                  <div className="text-[11px] uppercase tracking-wider text-white/70 font-medium">Total listings</div>
                  <div className="font-serif text-3xl font-semibold mt-1">{t.listings}</div>
                  <div className="text-xs text-white/70 mt-1">{t.active} active · {t.sold} sold</div>
                </Card>
                <Card>
                  <div className="text-[11px] uppercase tracking-wider text-ink-faint font-medium">Stale (30d+)</div>
                  <div className={`font-serif text-3xl font-semibold mt-1 ${t.stale > 0 ? 'text-amber-700' : 'text-ink'}`}>{t.stale}</div>
                  <div className="text-xs text-ink-soft mt-1">{t.stale > 0 ? 'Worth a price refresh' : 'Nothing stale yet'}</div>
                </Card>
                <Card>
                  <div className="text-[11px] uppercase tracking-wider text-ink-faint font-medium">Query impressions · 30d</div>
                  <div className="font-serif text-3xl font-semibold mt-1">{t.impressions30d.toLocaleString()}</div>
                  <div className="text-xs text-ink-soft mt-1">Chatbot surfacings</div>
                </Card>
                <Card>
                  <div className="text-[11px] uppercase tracking-wider text-ink-faint font-medium">CTR · 30d</div>
                  <div className="font-serif text-3xl font-semibold mt-1">{t.ctrPct ? t.ctrPct.toFixed(1) + '%' : '—'}</div>
                  <div className="text-xs text-ink-soft mt-1">{t.clicks30d.toLocaleString()} clicks</div>
                </Card>
              </div>

              {/* Empty state OR feeds-and-facets summary */}
              {!invState.hasAnyFeed ? (
                <Card>
                  <div className="border-2 border-dashed border-surface-edge rounded-xl p-7 text-center">
                    <div className="inline-flex w-12 h-12 rounded-xl bg-brand-50 text-brand-700 items-center justify-center mb-3">
                      <Icon name="box" size={24} />
                    </div>
                    <div className="font-serif text-lg font-semibold text-ink">No feeds connected yet</div>
                    <p className="text-sm text-ink-soft mt-1 max-w-2xl mx-auto">
                      Connect a feed from your DMS, MLS, or marketplace and your listings start showing up
                      in your publisher's chatbot results within an hour. Or import a sample so you can see
                      what a populated dashboard looks like.
                    </p>
                    {invState.tierEligible && (
                      <div className="mt-4 flex flex-wrap items-center justify-center gap-2">
                        <button
                          disabled={importing === 'vauto'}
                          onClick={() => handleImportFixture('vauto')}
                          className="px-3 py-2 rounded-lg border border-surface-edge bg-white text-ink-soft text-sm hover:border-brand-700 hover:text-brand-700 inline-flex items-center gap-2 disabled:opacity-50">
                          {importing === 'vauto' ? 'Importing…' : 'Import sample · auto dealer'}
                        </button>
                        <button
                          disabled={importing === 'mls'}
                          onClick={() => handleImportFixture('mls')}
                          className="px-3 py-2 rounded-lg border border-surface-edge bg-white text-ink-soft text-sm hover:border-brand-700 hover:text-brand-700 inline-flex items-center gap-2 disabled:opacity-50">
                          {importing === 'mls' ? 'Importing…' : 'Import sample · realty'}
                        </button>
                        <button
                          disabled={importing === 'tractor_house'}
                          onClick={() => handleImportFixture('tractor_house')}
                          className="px-3 py-2 rounded-lg border border-surface-edge bg-white text-ink-soft text-sm hover:border-brand-700 hover:text-brand-700 inline-flex items-center gap-2 disabled:opacity-50">
                          {importing === 'tractor_house' ? 'Importing…' : 'Import sample · ag equipment'}
                        </button>
                        <button
                          onClick={() => setShowConnect(true)}
                          className="px-3 py-2 rounded-lg bg-brand-700 text-white text-sm hover:bg-brand-800 inline-flex items-center gap-2">
                          <Icon name="plus" size={14} /> Connect a real feed
                        </button>
                      </div>
                    )}
                    <div className="mt-4 grid grid-cols-1 md:grid-cols-3 gap-3 text-left max-w-3xl mx-auto">
                      <div className="border border-surface-edge rounded-lg p-3 bg-surface">
                        <div className="text-xs uppercase tracking-wider font-semibold text-ink-faint">Auto dealers</div>
                        <div className="text-sm text-ink mt-1">DealerCenter · vAuto</div>
                      </div>
                      <div className="border border-surface-edge rounded-lg p-3 bg-surface">
                        <div className="text-xs uppercase tracking-wider font-semibold text-ink-faint">Real estate</div>
                        <div className="text-sm text-ink mt-1">MLS / RETS</div>
                      </div>
                      <div className="border border-surface-edge rounded-lg p-3 bg-surface">
                        <div className="text-xs uppercase tracking-wider font-semibold text-ink-faint">Ag · marine</div>
                        <div className="text-sm text-ink mt-1">TractorHouse · BoatTrader</div>
                      </div>
                    </div>
                  </div>
                </Card>
              ) : (
                <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
                  <Card>
                    <SectionHeader title="Connected feeds" subtitle="Last sync + listing count per source." />
                    <div className="space-y-2">
                      {invState.feeds.map(f => (
                        <div key={f.id} className="border border-surface-edge rounded-lg px-3 py-2 flex items-center gap-3">
                          <div className={`shrink-0 w-9 h-9 rounded-lg ${f.status === 'connected' ? 'bg-emerald-50 text-emerald-700' : 'bg-slate-100 text-slate-500'} flex items-center justify-center`}>
                            <Icon name="box" size={16} />
                          </div>
                          <div className="flex-1 min-w-0">
                            <div className="text-sm font-medium text-ink truncate">{f.feedTypeLabel} · {f.locationLabel}</div>
                            <div className="text-xs text-ink-faint">{f.lastSyncStatus || '—'}</div>
                          </div>
                          <button
                            onClick={() => handleSync(f.id)}
                            disabled={syncing === f.id || f.status !== 'connected'}
                            className="text-xs px-2 py-1 rounded border border-surface-edge text-ink-soft hover:text-brand-700 hover:border-brand-700 disabled:opacity-50">
                            {syncing === f.id ? 'Syncing…' : 'Sync'}
                          </button>
                        </div>
                      ))}
                    </div>
                  </Card>

                  <Card>
                    <SectionHeader title="Search visibility (top facets)" subtitle="How consumers find your inventory in chatbot results." />
                    {invState.facetHits.length === 0 ? (
                      <div className="text-sm text-ink-soft">No facet hits yet. Once consumers search the chatbot we'll see what queries surface your inventory.</div>
                    ) : (
                      <div className="space-y-2">
                        {invState.facetHits.slice(0, 4).map(h => (
                          <div key={h.id} className="border border-surface-edge rounded-lg px-3 py-2">
                            <div className="flex items-center justify-between gap-2">
                              <div className="text-sm text-ink truncate">"{h.facetText}"</div>
                              <Pill color={h.rank === 1 ? 'emerald' : 'slate'}>#{h.rank}</Pill>
                            </div>
                            <div className="text-xs text-ink-faint mt-1">{h.hits30d} hits · last 30 days</div>
                          </div>
                        ))}
                      </div>
                    )}
                  </Card>
                </div>
              )}
            </div>
          )}

          {tab === 'listings' && (
            <div className="space-y-4 fade-in">
              <Card>
                <div className="flex items-center justify-between gap-3 flex-wrap">
                  <div className="flex items-center gap-2">
                    {['all', 'active', 'stale', 'pending', 'sold'].map(s => (
                      <button key={s}
                        onClick={() => setStatusFilter(s)}
                        className={`text-xs px-2.5 py-1 rounded-full border ${statusFilter === s ? 'bg-brand-700 text-white border-brand-700' : 'bg-white text-ink-soft border-surface-edge hover:border-brand-300'}`}>
                        {s === 'all' ? 'All' : s.charAt(0).toUpperCase() + s.slice(1)}
                      </button>
                    ))}
                  </div>
                  <div className="flex items-center gap-2">
                    <Icon name="search" size={14} className="text-ink-faint" />
                    <input
                      value={search}
                      onChange={e => setSearch(e.target.value)}
                      placeholder="Search listings…"
                      className="text-sm border border-surface-edge rounded-lg px-3 py-1.5 w-56" />
                  </div>
                </div>
              </Card>
              <Card padded={false}>
                {filteredListings.length === 0 ? (
                  <div className="p-7 text-center text-sm text-ink-soft">
                    {invState.hasAnyListing ? 'No listings match these filters.' : 'No listings yet — connect a feed or import a sample on the Overview tab.'}
                  </div>
                ) : (
                  <div className="overflow-x-auto">
                    <table className="w-full text-sm">
                      <thead className="bg-surface border-b border-surface-edge text-ink-faint">
                        <tr>
                          <th className="text-left px-4 py-2 font-medium">Listing</th>
                          <th className="text-left px-4 py-2 font-medium">Price</th>
                          <th className="text-left px-4 py-2 font-medium">Status</th>
                          <th className="text-left px-4 py-2 font-medium">Days listed</th>
                          <th className="text-left px-4 py-2 font-medium">Impressions</th>
                          <th className="text-left px-4 py-2 font-medium">Clicks</th>
                        </tr>
                      </thead>
                      <tbody>
                        {filteredListings.map(li => (
                          <tr key={li.id} className="border-b border-surface-edge last:border-0 hover:bg-surface">
                            <td className="px-4 py-2.5">
                              <div className="font-medium text-ink truncate max-w-md">{li.title}</div>
                              <div className="text-xs text-ink-faint">{li.externalId}</div>
                            </td>
                            <td className="px-4 py-2.5 font-medium text-ink">{fmtMoneyCents(li.priceCents)}</td>
                            <td className="px-4 py-2.5">
                              <Pill color={li.isStale ? 'amber' : li.status === 'sold' ? 'slate' : li.status === 'pending' ? 'violet' : 'emerald'}>
                                {li.isStale ? 'Stale' : li.status.charAt(0).toUpperCase() + li.status.slice(1)}
                              </Pill>
                            </td>
                            <td className="px-4 py-2.5 text-ink-soft">{li.daysListed} d</td>
                            <td className="px-4 py-2.5 text-ink-soft">{li.queryImpressions30d.toLocaleString()}</td>
                            <td className="px-4 py-2.5 text-ink-soft">{li.clicks30d}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                )}
              </Card>
              {invState.totals.stale > 0 && (
                <div className="text-xs text-amber-700 px-1">
                  {invState.totals.stale} listing{invState.totals.stale === 1 ? '' : 's'} flagged stale (over {invState.staleThreshold} days listed with zero clicks). Consider a price refresh or new photos.
                </div>
              )}
            </div>
          )}

          {tab === 'search' && (
            <div className="fade-in">
              <Card>
                <SectionHeader title="Faceted-search visibility"
                  subtitle="What consumer queries surface your listings — and how high you rank." />
                {invState.facetHits.length === 0 ? (
                  <div className="border-2 border-dashed border-surface-edge rounded-xl p-7 text-center">
                    <div className="inline-flex w-12 h-12 rounded-xl bg-brand-50 text-brand-700 items-center justify-center mb-3">
                      <Icon name="search" size={24} />
                    </div>
                    <div className="font-serif text-base font-semibold text-ink">No search data yet</div>
                    <p className="text-sm text-ink-soft mt-1 max-w-xl mx-auto">
                      Once consumers ask your publisher's chatbot about inventory in your category,
                      you'll see the exact queries that surfaced your listings here — and what rank you held.
                    </p>
                  </div>
                ) : (
                  <div className="space-y-2.5">
                    {invState.facetHits.map(h => (
                      <div key={h.id} className="border border-surface-edge rounded-lg p-3 flex items-center justify-between gap-4">
                        <div className="min-w-0">
                          <div className="text-sm text-ink truncate">"{h.facetText}"</div>
                          <div className="text-xs text-ink-faint">{h.hits30d} chatbot hits · last 30 days</div>
                        </div>
                        <Pill color={h.rank === 1 ? 'emerald' : h.rank <= 3 ? 'violet' : 'slate'}>Rank #{h.rank}</Pill>
                      </div>
                    ))}
                  </div>
                )}
              </Card>
            </div>
          )}

          {tab === 'feeds' && (
            <div className="space-y-4 fade-in">
              <Card>
                <SectionHeader title="Connected feeds"
                  subtitle="One row per data source. Sync nightly by default; click sync to refresh now." />
                {invState.feeds.length === 0 ? (
                  <div className="text-sm text-ink-soft">No feeds connected. Use the "Connect feed" button up top to add one.</div>
                ) : (
                  <div className="space-y-2.5">
                    {invState.feeds.map(f => (
                      <div key={f.id} className="border border-surface-edge rounded-lg p-3 flex items-center gap-3">
                        <div className={`shrink-0 w-10 h-10 rounded-lg ${f.status === 'connected' ? 'bg-emerald-50 text-emerald-700' : 'bg-slate-100 text-slate-500'} flex items-center justify-center`}>
                          <Icon name="box" size={18} />
                        </div>
                        <div className="flex-1 min-w-0">
                          <div className="text-sm font-medium text-ink">{f.feedTypeLabel}</div>
                          <div className="text-xs text-ink-soft">{f.locationLabel}</div>
                          <div className="text-xs text-ink-faint mt-0.5">
                            {f.lastSyncStatus || '—'} · {f.lastSyncAt ? new Date(f.lastSyncAt).toLocaleString() : 'never synced'}
                          </div>
                        </div>
                        <Pill color={f.status === 'connected' ? 'emerald' : 'slate'}>
                          {f.status}
                        </Pill>
                        <button
                          onClick={() => handleSync(f.id)}
                          disabled={syncing === f.id || f.status !== 'connected'}
                          className="text-xs px-2.5 py-1 rounded-lg border border-surface-edge text-ink-soft hover:text-brand-700 hover:border-brand-700 disabled:opacity-50">
                          {syncing === f.id ? 'Syncing…' : 'Sync'}
                        </button>
                        <button
                          onClick={() => handleDisconnect(f.id)}
                          className="text-xs px-2.5 py-1 rounded-lg border border-rose-200 text-rose-600 hover:bg-rose-50">
                          Disconnect
                        </button>
                      </div>
                    ))}
                  </div>
                )}
              </Card>
            </div>
          )}
        </div>

        {/* Connect-feed modal */}
        <Modal
          open={showConnect}
          onClose={() => setShowConnect(false)}
          title="Connect a feed"
          footer={
            <div className="flex items-center justify-end gap-2">
              <button onClick={() => setShowConnect(false)} className="px-3 py-2 rounded-lg text-ink-soft hover:bg-surface text-sm">Cancel</button>
              <button onClick={handleCreateFeed} disabled={creatingFeed || !newFeed.location_label.trim()}
                className="px-3 py-2 rounded-lg bg-brand-700 text-white text-sm hover:bg-brand-800 disabled:opacity-50">
                {creatingFeed ? 'Connecting…' : 'Connect'}
              </button>
            </div>
          }>
          <div className="space-y-4">
            <div>
              <div className="text-xs uppercase tracking-wider font-semibold text-ink-faint mb-2">Feed type</div>
              <div className="grid grid-cols-2 gap-2">
                {(invState.feedTypes || []).map(ft => (
                  <button key={ft.key}
                    onClick={() => setNewFeed({ ...newFeed, feed_type: ft.key })}
                    className={`text-left text-sm border rounded-lg px-3 py-2 ${newFeed.feed_type === ft.key ? 'border-brand-700 bg-brand-50 text-ink' : 'border-surface-edge text-ink-soft hover:border-brand-300'}`}>
                    {ft.label}

  /* ============================================================

  const ChatbotPreviewView = ({ onNavigate, onTrain }) => {
    const { business } = useDashboard();

    const [state, setState]     = useState(null);
    const [loading, setLoading] = useState(true);
    const [error, setError]     = useState(null);

    // Sync the dashboard-context chatbot slim slice from a freshly-fetched
    // /api/chatbot response. Keeps the sidebar badge + Home tile honest
    // without a separate /api/bootstrap roundtrip. Also patches stats.chatbot
    // so the Home view's "Chatbot conversations" tile matches the live count
    // right after Import sample / Clear fixtures.
    const syncBootstrapSlice = useCallback((data) => {
      const count = data.totals?.count || 0;
      mutate(prev => prev ? ({
        ...prev,
        chatbot: {
          ...(prev.chatbot || {}),  // preserve hasAnyKey (not in /api/chatbot payload)
          tierEligible:      data.tierEligible,
          conversationCount: count,
          escalationCount:   data.totals?.escalationCount || 0,
        },
        stats: prev.stats ? ({
          ...prev.stats,
          chatbot: {
            ...(prev.stats.chatbot || {}),
            value:  count,
            helper: count > 0 ? 'served this month' : 'not yet configured',
          },
        }) : prev.stats,
      }) : prev);
    }, [mutate]);

    const refresh = useCallback(async () => {
      try {
        const r = await fetch('/api/chatbot');
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        const data = await r.json();
        setState(data);
        syncBootstrapSlice(data);
        setError(null);
      } catch (e) {
        console.error('[chatbot.refresh]', e);
        setError(`Couldn't load chatbot conversations: ${e.message || e}`);
      } finally {
        setLoading(false);
      }
    }, [syncBootstrapSlice]);
    useEffect(() => { refresh(); }, [refresh]);

    const handleSeed = async () => {
      setSeeding(true);
      try {
        const r = await fetch('/api/chatbot/seed-fixtures', { method: 'POST' });
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        await refresh();
      } catch (e) {
        console.error('[chatbot.seed]', e);
        setError(`Couldn't seed sample conversations: ${e.message || e}`);
      } finally {
        setSeeding(false);
      }
    };

    const handleClear = async () => {
      if (!window.confirm('Clear all sample conversations? Real consumer chats are not affected.')) return;
      try {
        const r = await fetch('/api/chatbot/fixtures', { method: 'DELETE' });
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        setOpenId(null);
        setTranscript(null);
        await refresh();
      } catch (e) {
        console.error('[chatbot.clearFixtures]', e);
        setError(`Couldn't clear samples: ${e.message || e}`);
      }
    };

    const openTranscript = async (conv) => {
      setOpenId(conv.id);
      setTranscript(null);
      try {
        const r = await fetch(`/api/chatbot/conversations/${conv.id}`);
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        setTranscript(await r.json());
      } catch (e) {
        console.error('[chatbot.transcript]', e);
        setError(`Couldn't load transcript: ${e.message || e}`);
      }
    };

    if (loading) {
      return (
        <div className="px-8 py-7">
          <TopBar breadcrumb="Chatbot" title="Chatbot Preview" subtitle="Consumer conversations with your chatbot." />
          <div className="text-ink-soft text-sm mt-6">Loading conversations…</div>
        </div>

    }
    if (!state) {
      return (
        <div className="px-8 py-7">
          <TopBar breadcrumb="Chatbot" title="Chatbot Preview" subtitle="Consumer conversations with your chatbot." />

      if (escOnly && !c.escalationFlag) return false;
      if (search && !c.topicLabel.toLowerCase().includes(search.toLowerCase())) return false;
      return true;
    });

    const sentimentEntries = Object.entries(state.totals.sentimentCounts || {});

    return (
      <div className="fade-in">
        <TopBar
          breadcrumb="Chatbot"
          title="Chatbot Preview"
          subtitle="The conversations your consumers are having with your publisher chatbot."
          right={
            <div className="flex items-center gap-2">
              <Pill color={state.tierEligible ? 'emerald' : 'slate'}>
                Tier {state.tier} — {state.tierEligible ? 'Chatbot included' : 'Upgrade required'}

                <button onClick={handleClear} className="px-3 py-2 rounded-lg border border-rose-200 text-rose-600 hover:bg-rose-50 text-sm">

                  {seeding ? 'Importing…' : (<><Icon name="sparkles" size={14} /> Import sample conversations</>)}
                </button>
              ))}
            </div>
          }
        />

        {error && (
          <div className="mx-8 mt-3 px-4 py-2 rounded-lg bg-rose-50 border border-rose-200 text-rose-800 text-sm flex items-center justify-between">
            <span>{error}</span>
            <button className="text-rose-600 hover:text-rose-800" onClick={() => setError(null)}><Icon name="x" size={14} /></button>
