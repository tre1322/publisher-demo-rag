        <div className="px-8 py-7 space-y-5">
          {/* Day-1 empty state */}
          {!state.hasAnyConversation ? (
            <Card>
              <div className="border-2 border-dashed border-surface-edge rounded-xl p-7 text-center">
                <div className="inline-flex w-12 h-12 rounded-xl bg-brand-50 text-brand-700 items-center justify-center mb-3">
                  <Icon name="convo" size={24} />
                </div>
                <div className="font-serif text-lg font-semibold text-ink">No consumer conversations yet</div>
                <p className="text-sm text-ink-soft mt-1 max-w-2xl mx-auto">
                  Once your publisher's chatbot starts talking to consumers about your business, every session
                  shows up here — with sentiment, escalation flags, and full transcripts. You see what your
                  consumers are actually asking and where the bot may need backup.
                </p>
                {state.tierEligible && (
                  <button onClick={handleSeed} disabled={seeding}
                    className="mt-4 px-3 py-2 rounded-lg bg-brand-700 text-white text-sm hover:bg-brand-800 disabled:opacity-50 inline-flex items-center gap-2">
                    {seeding ? 'Importing…' : (<><Icon name="sparkles" size={14} /> Import sample conversations</>)}
                  </button>
                )}
                <div className="mt-5 grid grid-cols-1 md:grid-cols-3 gap-3 text-left max-w-3xl mx-auto">
                  <div className="border border-surface-edge rounded-lg p-3 bg-surface">
                    <div className="text-xs uppercase tracking-wider font-semibold text-emerald-700">Positive signals</div>
                    <div className="text-sm text-ink mt-1">"That's what I needed — thank you."</div>
                  </div>
                  <div className="border border-surface-edge rounded-lg p-3 bg-surface">
                    <div className="text-xs uppercase tracking-wider font-semibold text-amber-700">Escalation flags</div>
                    <div className="text-sm text-ink mt-1">Hot leads worth a personal follow-up.</div>
                  </div>
                  <div className="border border-surface-edge rounded-lg p-3 bg-surface">
                    <div className="text-xs uppercase tracking-wider font-semibold text-slate-700">Coverage gaps</div>
                    <div className="text-sm text-ink mt-1">Questions the bot couldn't answer well.</div>
                  </div>
                </div>
              </div>
            </Card>
          ) : (
            <>
              {/* Stat row */}
              <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                <Card className="bg-gradient-to-br from-brand-700 to-brand-900 text-white">
                  <div className="text-[11px] uppercase tracking-wider text-white/70 font-medium">Total conversations</div>
                  <div className="font-serif text-3xl font-semibold mt-1">{state.totals.count}</div>
                  <div className="text-xs text-white/70 mt-1">Avg {state.totals.avgTurns.toFixed(1)} turns · {Math.round(state.totals.avgDurationSecs)}s</div>
                </Card>
                <Card>
                  <div className="text-[11px] uppercase tracking-wider text-ink-faint font-medium">Flagged for outreach</div>
                  <div className={`font-serif text-3xl font-semibold mt-1 ${state.totals.escalationCount > 0 ? 'text-amber-700' : 'text-ink'}`}>{state.totals.escalationCount}</div>
                  <div className="text-xs text-ink-soft mt-1">Hot leads or coverage gaps</div>
                </Card>
                <Card>
                  <div className="text-[11px] uppercase tracking-wider text-ink-faint font-medium">Sentiment mix</div>
                  <div className="mt-2 space-y-1">
                    {sentimentEntries.map(([k, v]) => v > 0 && (
                      <div key={k} className="flex items-center gap-2 text-xs">
                        <span className="inline-block w-2 h-2 rounded-full" style={{ background: SENTIMENT_CHIP[k]?.dot }}></span>
                        <span className="text-ink-soft flex-1 capitalize">{k}</span>
                        <span className="text-ink font-medium">{v}</span>
                      </div>
                    ))}
                  </div>
                </Card>
                <Card>
                  <div className="text-[11px] uppercase tracking-wider text-ink-faint font-medium">Top topics</div>
                  <div className="mt-2 space-y-1">
                    {(state.topTopics || []).slice(0, 3).map((t, i) => (
                      <div key={i} className="text-xs text-ink-soft truncate" title={t.label}>
                        <span className="font-medium text-ink">{t.count}×</span> {t.label}
                      </div>
                    ))}
                  </div>
                </Card>
              </div>

              {/* Filters + conversation list */}
              <Card>
                <div className="flex items-center justify-between gap-3 flex-wrap mb-3">
                  <div className="flex items-center gap-2 flex-wrap">
                    {['all', 'positive', 'neutral', 'negative', 'mixed'].map(s => (
                      <button key={s} onClick={() => setFilter(s)}
                        className={`text-xs px-2.5 py-1 rounded-full border ${filter === s ? 'bg-brand-700 text-white border-brand-700' : 'bg-white text-ink-soft border-surface-edge hover:border-brand-300'}`}>
                        {s.charAt(0).toUpperCase() + s.slice(1)}
                      </button>
                    ))}
                    <label className="flex items-center gap-1.5 text-xs text-ink-soft ml-2 cursor-pointer">
                      <input type="checkbox" checked={escOnly} onChange={e => setEscOnly(e.target.checked)} />
                      Escalations only
                    </label>
                  </div>
                  <div className="flex items-center gap-2">
                    <Icon name="search" size={14} className="text-ink-faint" />
                    <input value={search} onChange={e => setSearch(e.target.value)}
                      placeholder="Search topics…"
                      className="text-sm border border-surface-edge rounded-lg px-3 py-1.5 w-56" />
                  </div>
                </div>
                {filtered.length === 0 ? (
                  <div className="text-sm text-ink-soft text-center py-6">No conversations match these filters.</div>
                ) : (
                  <div className="space-y-2">
                    {filtered.map(c => {
                      const chip = SENTIMENT_CHIP[c.sentiment] || SENTIMENT_CHIP.neutral;
                      return (
                        <button key={c.id} onClick={() => openTranscript(c)}
                          className="w-full text-left border border-surface-edge rounded-lg p-3 hover:border-brand-300 hover:bg-surface transition-colors">
                          <div className="flex items-start justify-between gap-3">
                            <div className="flex-1 min-w-0">
                              <div className="text-sm font-medium text-ink">{c.topicLabel}</div>
                              <div className="text-xs text-ink-faint mt-0.5">
                                {c.consumerLabel} · {c.turnCount} turns · {Math.round(c.durationSeconds)}s
                                {c.referrerLabel ? ` · via ${c.referrerLabel}` : ''}
                              </div>
                            </div>
                            <div className="flex items-center gap-2 shrink-0">
                              {c.source === 'fixture' && (
                                <span className="text-[10px] px-1.5 py-0.5 rounded-full border border-surface-edge text-ink-faint bg-surface uppercase tracking-wider font-semibold" title="Seeded demo conversation. Real ingested conversations have no Demo chip.">Demo</span>
                              )}
                              {c.escalationFlag && (
                                <Pill color="amber" icon="alert">Escalate</Pill>
                              )}
                              <span className={`text-xs px-2 py-0.5 rounded-full ${chip.bg} ${chip.text}`}>
                                {c.sentimentLabel}
                              </span>
                            </div>
                          </div>
                          {c.escalationFlag && c.escalationReason && (
                            <div className="text-xs text-amber-800 mt-2 bg-amber-50 border border-amber-200 rounded px-2 py-1">
                              <span className="font-medium">Why flagged:</span> {c.escalationReason}
                            </div>
                          )}
                        </button>
                      );
                    })}
                  </div>
                )}
              </Card>
            </>
          )}
        </div>

        {/* Transcript modal */}
        <Modal
          open={openId != null}
          onClose={() => { setOpenId(null); setTranscript(null); }}
          title={transcript?.topicLabel || 'Conversation transcript'}
          footer={
            <div className="flex items-center justify-between gap-3">
              <div className="text-xs text-ink-faint">
                {transcript && (
                  <>{transcript.consumerLabel} · {transcript.turnCount} turns · {Math.round(transcript.durationSeconds)}s</>
                )}
              </div>
              <button
                onClick={() => {
                  if (!transcript) return;
                  const phrases = extractTrainingPhrases(transcript);
                  if (phrases.length === 0) {
                    // Defensive: a transcript with no consumer turn is unusual,
                    // but soft-fall to a plain navigate so the CTA never feels broken.
                    onNavigate?.('plan');
                    return;
                  }
                  onTrain?.({
                    topicLabel: transcript.topicLabel,
                    escalationFlag: transcript.escalationFlag,
                    escalationReason: transcript.escalationReason,
                    phrases,
                  });
                  setOpenId(null);
                  setTranscript(null);
                }}
                className="px-3 py-1.5 rounded-lg bg-brand-700 text-white text-sm hover:bg-brand-800 inline-flex items-center gap-2">
                <Icon name="target" size={14} /> Train the bot on this
              </button>
            </div>
          }>
          {transcript == null ? (
            <div className="text-sm text-ink-soft">Loading transcript…</div>
          ) : (
            <div className="space-y-2">
              {(transcript.transcript || []).map((turn, i) => (
                <div key={i} className={`flex ${turn.who === 'consumer' ? 'justify-end' : 'justify-start'}`}>
                  <div className={`max-w-[80%] rounded-2xl px-3 py-2 text-sm ${turn.who === 'consumer' ? 'bg-brand-700 text-white' : 'bg-surface text-ink border border-surface-edge'}`}>
                    <div className="text-[10px] uppercase tracking-wider font-semibold mb-0.5 opacity-70">
                      {turn.who === 'consumer' ? 'Consumer' : 'Chatbot'}
                    </div>
                    <div className="whitespace-pre-wrap">{turn.text}</div>
                  </div>
                </div>
              ))}
            </div>
          )}
        </Modal>
      </div>
    );
  };

  /* ============================================================
     VIEW: SETTINGS
     ============================================================ */
  const SettingsView = ({ onTalkToHuman, linkedinReturn }) => {
    const { business, stats, attention, weekRecap, posts, approvals, performance, reviews, marketingPlan, chat, settings } = useDashboard();
    const mutate = useDashboardMutate();
    const [tab, setTab] = useState('account');
    const [cadence, setCadence] = useState(settings.cadence);
    const [notifs, setNotifs] = useState(() => (settings.notifications || []).map(n => ({ ...n })));
    const [savingSettings, setSavingSettings] = useState(false);
    const [settingsError, setSettingsError] = useState(null);
    const [settingsToast, setSettingsToast] = useState(null);

    // Phase F.2 — Billing state. Loaded on demand when the Billing tab opens
    // (avoids a useless fetch for owners who never visit it).
    const [billingState, setBillingState] = useState(null);
    const [billingLoading, setBillingLoading] = useState(false);
    const [tierRequestBusy, setTierRequestBusy] = useState(null);  // tier num while submitting
    const refreshBilling = useCallback(async () => {
      setBillingLoading(true);
      try {
        const r = await fetch('/api/billing');
        if (r.ok) setBillingState(await r.json());
      } catch (e) {
        console.error('[settings.billing]', e);
      } finally {
        setBillingLoading(false);
      }
    }, []);
    useEffect(() => { if (tab === 'billing' && !billingState) refreshBilling(); }, [tab, billingState, refreshBilling]);

    // Phase G — Integrations state. Loaded on demand when the Integrations tab opens.
    // newKeyRaw holds the just-minted raw key for the "copy this once" banner;
    // it's cleared on tab-leave so a refresh doesn't re-show a stale secret.
    const [keys, setKeys] = useState(null);
    const [keysLoading, setKeysLoading] = useState(false);
    const [newKeyLabel, setNewKeyLabel] = useState('');
    const [newKeyBusy, setNewKeyBusy] = useState(false);
    const [newKeyRaw, setNewKeyRaw] = useState(null);  // { id, label, keyPrefix, rawKey }
    const [copyToast, setCopyToast] = useState(null);
    const refreshKeys = useCallback(async () => {
      setKeysLoading(true);
      try {
        const r = await fetch('/api/chatbot/keys');
        if (r.ok) setKeys(await r.json());
      } catch (e) {
        console.error('[settings.keys]', e);
      } finally {
        setKeysLoading(false);
      }
    }, []);
    useEffect(() => { if (tab === 'integrations' && keys === null) refreshKeys(); }, [tab, keys, refreshKeys]);
    useEffect(() => { if (tab !== 'integrations' && newKeyRaw) setNewKeyRaw(null); }, [tab, newKeyRaw]);
    const handleCreateKey = async () => {
      const label = (newKeyLabel || '').trim() || `${business.publisher || 'Publisher'} chatbot`;
      setNewKeyBusy(true);
      setSettingsError(null);
      try {
        const r = await fetch('/api/chatbot/keys', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ label }),
        });
        if (!r.ok) {
          const detail = await r.json().catch(() => ({ detail: `HTTP ${r.status}` }));
          throw new Error(detail.detail || `HTTP ${r.status}`);
        }
        const data = await r.json();
        setNewKeyRaw(data);
        setNewKeyLabel('');
        await refreshKeys();
      } catch (e) {
        setSettingsError(`Couldn't mint key: ${e.message || e}`);
      } finally {
        setNewKeyBusy(false);
      }
    };
    const handleRevokeKey = async (id) => {
      if (!window.confirm('Revoke this key? Any chatbot relay using it will stop ingesting immediately.')) return;
      try {
        const r = await fetch(`/api/chatbot/keys/${id}`, { method: 'DELETE' });
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        await refreshKeys();
      } catch (e) {
        setSettingsError(`Couldn't revoke: ${e.message || e}`);
      }
    };
    const copyToClipboard = (text, kind = 'value') => copyTextToClipboard(
      text,
      () => { setCopyToast(`${kind} copied to clipboard.`); setTimeout(() => setCopyToast(null), 2200); },
      () => { setCopyToast(`Couldn't copy — select + ⌘C manually.`); setTimeout(() => setCopyToast(null), 2200); },
    );
    const handleTierChange = async (to_tier) => {
      setTierRequestBusy(to_tier);
      try {
        const r = await fetch('/api/billing/change-tier-request', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ to_tier }),
        });
        if (!r.ok) {
          const detail = await r.json().catch(() => ({ detail: `HTTP ${r.status}` }));
          throw new Error(detail.detail || `HTTP ${r.status}`);
        }
        setSettingsToast(`Tier-change request to Tier ${to_tier} recorded. We'll be in touch.`);
        await refreshBilling();
      } catch (e) {
        setSettingsError(`Couldn't submit request: ${e.message || e}`);
      } finally {
        setTierRequestBusy(null);
      }
    };

    // Phase E.6 — ad-account connection state. Loaded from /api/ads on mount;
    // refetched after each connect/disconnect. Distinct from settings.connections
    // (social presence) because ad-account auth is a different OAuth scope.
    const [adConnections, setAdConnections] = useState(null);
    const [adConnBusy, setAdConnBusy] = useState(null);  // platform key while OAuthing
    const refreshAdConnections = useCallback(async () => {
      try {
        const r = await fetch('/api/ads');
        if (r.ok) {
          const data = await r.json();
          setAdConnections(data.connections);
        }
      } catch (e) {
        console.error('[settings.adConnections]', e);
      }
    }, []);
    useEffect(() => { refreshAdConnections(); }, [refreshAdConnections]);

    const handleAdConnect = async (platform) => {
      setAdConnBusy(platform);
      try {
        // Mock OAuth — back-end POST returns immediately. Real OAuth would
        // redirect to platform's auth screen then back. UI 1.2s delay
        // approximates the OAuth round-trip feel.
        await new Promise(r => setTimeout(r, 1200));
        const r = await fetch('/api/ads/connections', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ platform }),
        });
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        await refreshAdConnections();
      } catch (e) {
        console.error('[settings.adConnect]', e);
        setSettingsError(`Couldn't connect: ${e.message || e}`);
      } finally {
        setAdConnBusy(null);
      }
    };

    const handleAdDisconnect = async (connectionId) => {
      setAdConnBusy(connectionId);
      try {
        const r = await fetch(`/api/ads/connections/${connectionId}`, { method: 'DELETE' });
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        await refreshAdConnections();
        await refreshLinkedinStatus();
      } catch (e) {
        console.error('[settings.adDisconnect]', e);
        setSettingsError(`Couldn't disconnect: ${e.message || e}`);
      } finally {
        setAdConnBusy(null);
      }
    };

    // Phase I.1 — LinkedIn is the first platform with REAL OAuth. This status
    // tells the UI whether credentials are configured (live) and whether this
    // business has a token-valid connection. When not live, the LinkedIn row
    // behaves exactly like the mock platforms.
    const [linkedinStatus, setLinkedinStatus] = useState(null);
    const refreshLinkedinStatus = useCallback(async () => {
      try {
        const r = await fetch('/api/integrations/linkedin/status');
        if (r.ok) setLinkedinStatus(await r.json());
      } catch (e) {
        console.error('[settings.linkedinStatus]', e);
      }
    }, []);
    useEffect(() => { refreshLinkedinStatus(); }, [refreshLinkedinStatus]);

    const handleLinkedInConnect = async () => {

        no_handshake:   ['LinkedIn connect session expired — start again.', 'error'],
        missing_params: ['LinkedIn returned an incomplete response — try again.', 'error'],

      if (kind === 'error') setSettingsError(msg); else setSettingsToast(msg);
      if (linkedinReturn === 'connected') refreshLinkedinStatus();

  // Banner that surfaces a bootstrap-load failure visibly. Per global CLAUDE.md
  // disabled-visible pattern: never silently fall back to demo data without

  const BootstrapErrorBanner = ({ message }) => (

  );

  /* ============================================================
     Talk-to-a-human modal — Phase B.4 wired to POST /api/escalations
     Owns its own state so message/send/error/success are scoped to the
     modal and reset cleanly on close. Records the request server-side;
     actual notification routing (email to publisher rep + PN team) is
     Phase F.
     ============================================================ */
  const TalkToHumanModal = ({ open, onClose, business }) => {
    const [message, setMessage] = useState('');
    const [sending, setSending] = useState(false);
    const [error, setError] = useState(null);
    const [success, setSuccess] = useState(false);

    // Reset state on every open so cancel-then-reopen feels fresh.
    useEffect(() => {
      if (open) {
        setMessage('');
        setError(null);
        setSuccess(false);
        setSending(false);
      }
    }, [open]);

    const send = async () => {
      const trimmed = message.trim();
      if (!trimmed) {
        setError('Add a quick note so we know what you need.');
        return;
      }
      setSending(true);
      setError(null);
      try {
        const resp = await fetch('/api/escalations', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: trimmed }),
        });
        if (!resp.ok) {
          const detail = await resp.json().catch(() => ({ detail: `HTTP ${resp.status}` }));
          throw new Error(detail.detail || `HTTP ${resp.status}`);
        }
        setSuccess(true);
        // Briefly hold the success view, then close so the user sees confirmation.
        setTimeout(() => { onClose(); }, 1800);
      } catch (e) {
        console.error('[escalation] failed', e);
        setError(`Couldn't send — ${e.message || e}. Try calling instead if it's urgent.`);
      } finally {
        setSending(false);
      }
    };

    return (
      <Modal
        open={open}
        onClose={sending ? () => {} : onClose}
        title={success ? 'Sent ✓' : 'Talk to a human'}
        footer={success ? (
          <Button variant="primary" onClick={onClose}>Done</Button>
        ) : (
          <>
            <Button variant="ghost" onClick={onClose} disabled={sending}>Cancel</Button>
            <Button icon="send" variant="primary" onClick={send} disabled={sending || !message.trim()}>
              {sending ? 'Sending…' : 'Send'}
            </Button>
          </>
        )}>
        {success ? (
          <div className="space-y-3 text-sm">
            <div className="flex items-start gap-3">
              <div className="shrink-0 w-9 h-9 rounded-full bg-emerald-50 text-emerald-600 flex items-center justify-center">
                <Icon name="check" size={18} strokeWidth={2.4} />
              </div>
              <p className="text-ink leading-relaxed">
                Your note is in the queue. Your publisher rep at {business.publisher} will reach out within one business day.
              </p>
            </div>
            <p className="text-xs text-ink-faint">Need someone faster? Call (507) 555-0100 Mon–Fri 8am–5pm Central.</p>
          </div>
        ) : (
          <>
            <p className="text-sm text-ink-soft">
              We'll get back to you within one business day. Your message goes to your publisher rep at the <span className="font-medium text-ink">{business.publisher}</span> and the Popular Network team.
            </p>
            <div className="mt-4 space-y-3">
              <div>
                <label className="text-xs uppercase tracking-wider font-medium text-ink-faint">From</label>
                <div className="mt-1 px-3 py-2 rounded-lg border border-surface-edge bg-surface text-sm">{business.owner} · {business.name}</div>
              </div>
              <div>
                <label className="text-xs uppercase tracking-wider font-medium text-ink-faint">What's on your mind?</label>
                <textarea
                  className="mt-1 w-full px-3 py-2 rounded-lg border border-surface-edge text-[15px] focus:outline-none focus:border-brand-500"
                  rows="4"
                  placeholder="Tell us what you need help with…"
                  value={message}
                  onChange={(e) => setMessage(e.target.value)}
                  disabled={sending}
                />
              </div>
              {error && (
                <div className="px-3 py-2 rounded-lg bg-red-50 border border-red-200 text-sm text-bad flex items-start gap-2">
                  <Icon name="alert" size={14} className="mt-0.5 shrink-0" />
                  <div className="flex-1">{error}</div>
                </div>
              )}
              <div className="text-xs text-ink-faint flex items-start gap-2">
                <Icon name="phone" size={12} className="mt-0.5 shrink-0" />
                <span>Or call us at <span className="font-medium text-ink">(507) 555-0100</span> Mon–Fri 8am–5pm Central.</span>
              </div>
            </div>
          </>
        )}
      </Modal>
    );
  };

  const App = () => {
    // Initial view honors ?tab=settings — the LinkedIn OAuth callback redirects
    // back to /?tab=settings&li=<status> so the owner lands where they started.
    const [view, setView] = useState(() => {
      try { return new URLSearchParams(window.location.search).get('tab') === 'settings' ? 'settings' : 'home'; }
      catch { return 'home'; }
    });
    // The OAuth return status (?li=connected|denied|error|...). Read once, then
    // handed to SettingsView which toasts it and scrubs the URL.
    const [linkedinReturn] = useState(() => {
      try { return new URLSearchParams(window.location.search).get('li'); }
      catch { return null; }
    });
    const [humanOpen, setHumanOpen] = useState(false);
    const [bootstrap, setBootstrap] = useState(null);
    const [loadError, setLoadError] = useState(null);
    // Phase B.7: when navigating from a CTA that links to a specific item
    // (e.g. Home → Approvals → highlight a1), the destination view reads this
    // and scrollIntoView + flashes a highlight ring. Auto-clears so a manual
    // re-visit doesn't re-trigger the scroll.
    const [scrollToId, setScrollToId] = useState(null);
    // Polish: when ChatbotPreview's "Train the bot on this" CTA fires, we stash
    // the captured intent here and navigate to plan; MarketingPlanView reads it
    // and renders a banner to confirm-or-dismiss the add to customer language.
    const [pendingTrain, setPendingTrain] = useState(null);
    const navigate = (nextView, nextScrollToId = null) => {
      setView(nextView);
      setScrollToId(nextScrollToId);
    };
    const handleTrain = (payload) => {
      setPendingTrain(payload);
      navigate('plan');
    };

    useEffect(() => {
      let cancelled = false;
      fetch('/api/bootstrap', { headers: { 'Accept': 'application/json' } })
        .then(r => {
          if (!r.ok) throw new Error(`HTTP ${r.status}`);
          return r.json();
        })
        .then(data => {
          if (cancelled) return;
          // Mirror the FALLBACK_DATA shape: collapse dailyReach arrays under
          // performance so the views can always read one source.
          if (data.performance) {
            data.performance.dailyReachCurrent = data.performance.dailyReachCurrent || dailyReachCurrent;
            data.performance.dailyReachPrev    = data.performance.dailyReachPrev    || dailyReachPrev;
          }
          setBootstrap(data);
          setLoadError(null);
          console.log('[bootstrap] loaded', {
            posts: data.posts?.length,
            approvals: data.approvals?.length,
            reviews: data.reviews?.recent?.length,
          });
        })
        .catch(err => {
          if (cancelled) return;
          console.error('[bootstrap] failed', err);
          setLoadError(err.message || String(err));
        });
      return () => { cancelled = true; };
    }, []);

    // While we wait, render the chrome with FALLBACK_DATA — useDashboard()
    // returns FALLBACK_DATA when the context value is null. No `display:none`,
    // no empty slots; failures stay diagnosable.
    const data = bootstrap || FALLBACK_DATA;
    const { business } = data;

    // Expose a mutate function only when we're actually wired to the backend.
    // Offline / fallback mode = no-op mutate, so optimistic updates can't
    // pretend to persist when there's no server.
    const mutate = bootstrap
      ? (updater) => setBootstrap(prev => typeof updater === 'function' ? updater(prev) : updater)
      : null;

    return (
      <DashboardMutateContext.Provider value={mutate}>
      <DashboardContext.Provider value={data}>
      <div className="flex h-screen w-full bg-surface">
        {loadError && <BootstrapErrorBanner message={loadError} />}
        <Sidebar current={view} onNavigate={(v) => navigate(v)} />
        <main className={`flex-1 overflow-y-auto ${loadError ? 'pt-9' : ''}`}>
          {view === 'home'        && <HomeView onNavigate={navigate} />}
          {view === 'compose'     && <ComposeView onNavigate={navigate} />}
          {view === 'calendar'    && <CalendarView onNavigate={navigate} />}
          {view === 'approvals'   && <ApprovalsView scrollToId={scrollToId} onScrollHandled={() => setScrollToId(null)} />}
          {view === 'performance' && <PerformanceView />}
          {view === 'ads'         && <AdsView onNavigate={navigate} />}
          {view === 'reviews'     && <ReviewsView scrollToId={scrollToId} onScrollHandled={() => setScrollToId(null)} />}
          {view === 'plan'        && <MarketingPlanView pendingTrain={pendingTrain} onClearTrain={() => setPendingTrain(null)} />}
          {view === 'inventory'   && <InventoryView onNavigate={navigate} />}
          {view === 'chat'        && <ChatView onNavigate={navigate} />}
          {view === 'chatbotpreview' && <ChatbotPreviewView onNavigate={navigate} onTrain={handleTrain} />}
          {view === 'settings'    && <SettingsView onTalkToHuman={() => setHumanOpen(true)} linkedinReturn={linkedinReturn} />}
        </main>

        <TalkToHumanModal
          open={humanOpen}
          onClose={() => setHumanOpen(false)}
          business={business}
        />
      </div>
      </DashboardContext.Provider>
      </DashboardMutateContext.Provider>
    );
  };

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
