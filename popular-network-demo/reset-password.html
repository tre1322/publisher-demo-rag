<!doctype html>
<!--
  Choose a new password — Phase 1. Opened from the emailed link
  (/reset-password?token=...). Checks the link with
  /api/auth/password-reset/lookup first so an expired link says so before
  the owner types anything, then POSTs to /confirm. Success signs the
  account out everywhere; the owner signs in again with the new password.
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Choose a new password</title>
  <!-- Pinned (see smoke_cdn_pins.py). -->
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <style>
    html { font-size: 19px; }
    body { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  </style>
</head>
<body class="min-h-screen bg-[#fafafa] flex items-center justify-center px-4">
  <div class="w-full max-w-md">
    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-8">
      <h1 class="text-xl font-semibold text-slate-900 mb-1">Choose a new password</h1>
      <p id="subtitle" class="text-sm text-slate-500 mb-6">Checking your reset link…</p>

      <form id="reset-form" class="space-y-4">
        <div>
          <label for="password" class="block text-sm font-medium text-slate-700 mb-1">New password</label>
          <input type="password" id="password" required minlength="8" autocomplete="new-password" disabled
            class="w-full px-3 py-2 border border-slate-300 rounded-lg text-base focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 disabled:bg-slate-50"
            placeholder="At least 8 characters" />
        </div>
        <div>
          <label for="confirm" class="block text-sm font-medium text-slate-700 mb-1">Type it again</label>
          <input type="password" id="confirm" required minlength="8" autocomplete="new-password" disabled
            class="w-full px-3 py-2 border border-slate-300 rounded-lg text-base focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 disabled:bg-slate-50" />
        </div>
        <div id="error-banner" role="alert" class="hidden text-sm text-red-700 bg-red-50 border border-red-200 rounded-lg px-3 py-2"></div>
        <button type="submit" id="submit-btn" disabled
          class="w-full bg-blue-600 hover:bg-blue-700 disabled:bg-blue-300 disabled:cursor-not-allowed text-white font-medium py-2.5 rounded-lg transition-colors">
          Save new password
        </button>
      </form>

      <div id="done" role="status" class="hidden text-sm text-emerald-900 bg-emerald-50 border border-emerald-200 rounded-lg px-3 py-3">
        Your password is changed, and you've been signed out on every device. <a href="/login" class="underline font-medium">Sign in</a> with the new one.
      </div>

      <p class="mt-6 text-sm text-center"><a href="/forgot-password" class="text-blue-700 hover:underline">Need a new link?</a></p>
    </div>
  </div>

  <script>
    const token = new URLSearchParams(window.location.search).get("token") || "";
    const form = document.getElementById("reset-form");
    const subtitle = document.getElementById("subtitle");
    const pw = document.getElementById("password");
    const pw2 = document.getElementById("confirm");
    const btn = document.getElementById("submit-btn");
    const errorBanner = document.getElementById("error-banner");

    function showError(msg) { errorBanner.textContent = msg; errorBanner.classList.remove("hidden"); }
    function setEnabled(on) { pw.disabled = pw2.disabled = btn.disabled = !on; }

    (async () => {
      if (token.length < 10) {
        subtitle.textContent = "This link is missing its code. Open the link from your email again, or ask for a new one.";
        return;
      }
      try {
        const resp = await fetch(`/api/auth/password-reset/lookup?token=${encodeURIComponent(token)}`);
        const body = await resp.json().catch(() => ({}));
        if (resp.ok && body.valid) {
          subtitle.textContent = `For ${body.email}. You'll be signed out everywhere and can sign in with the new password.`;
          setEnabled(true);
          pw.focus();
        } else {
          subtitle.textContent = "This reset link has expired or was already used. Ask for a new one below.";
        }
      } catch {
        subtitle.textContent = "Couldn't check the link (network error). Reload to try again.";
      }
    })();

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorBanner.classList.add("hidden");
      if (pw.value.length < 8) return showError("Use at least 8 characters.");
      if (pw.value !== pw2.value) return showError("The two passwords don't match.");
      setEnabled(false);
      btn.textContent = "Saving…";
      try {
        const resp = await fetch("/api/auth/password-reset/confirm", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token, password: pw.value }),
        });
        const body = await resp.json().catch(() => ({}));
        if (resp.ok) {
          form.classList.add("hidden");
          subtitle.classList.add("hidden");
          document.getElementById("done").classList.remove("hidden");
          return;
        }
        showError(typeof body.detail === "string" ? body.detail : `Couldn't save (${resp.status}).`);
        setEnabled(resp.status !== 400);  // 400 = dead link; don't invite a retry
      } catch {
        showError("Network error. Check your connection and try again.");
        setEnabled(true);
      } finally {
        btn.textContent = "Save new password";
      }
    });
  </script>
</body>
</html>
